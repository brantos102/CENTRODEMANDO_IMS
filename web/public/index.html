<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITSANET IMS — Centro de Mando</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b26; --panel2:#1b2331; --line:#252f42;
    --txt:#e8edf7; --dim:#8b98b5; --dim2:#5d6b87;
    --acc:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --viol:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:#60a5fa}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:13px 20px;
         display:flex;align-items:center;gap:13px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  h1{font-size:15px;margin:0;letter-spacing:.2px;white-space:nowrap}
  h1 b{color:var(--acc)}
  .estado{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
  .punto.ok{background:var(--ok);box-shadow:0 0 8px #22c55e66}
  .punto.bad{background:var(--bad)}
  main{padding:18px;max-width:1500px;margin:0 auto}
  select,input,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                      border-radius:7px;padding:7px 11px;font:inherit}
  select:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px}
  button{cursor:pointer}
  button.pri{background:var(--acc);border-color:var(--acc);font-weight:500}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.4;cursor:default}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 15px;border-radius:8px;border:1px solid var(--line);
       background:var(--panel);cursor:pointer;font-size:13px;color:var(--dim)}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
  .kpis{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .kpi .n{font-size:25px;font-weight:650;letter-spacing:-.7px;line-height:1.15}
  .kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--dim2);margin-top:2px}
  .kpi.bad .n{color:var(--bad)} .kpi.ok .n{color:var(--ok)}
  .kpi.warn .n{color:var(--warn)} .kpi.acc .n{color:var(--acc)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .grid.ancho{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h3{margin:0 0 13px;font-size:11.5px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.7px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
  .card h3 span{color:var(--dim2);font-weight:400;text-transform:none;letter-spacing:0}
  .fila{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
        padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .fila:first-of-type{border-top:0}
  .fila b{font-variant-numeric:tabular-nums;font-weight:600}
  .bar{height:5px;border-radius:3px;background:#212b3d;overflow:hidden;grid-column:1/-1;margin-top:1px}
  .bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
  .bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .tabla-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th{background:var(--panel2);color:var(--dim);text-align:left;padding:9px 12px;font-size:10.5px;
     text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  td{padding:8px 12px;border-top:1px solid var(--line)}
  tr:hover td{background:var(--panel2)}
  .chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);display:inline-block}
  .chip.ok{color:var(--ok);border-color:#1d4a2e;background:#122b1c}
  .chip.warn{color:var(--warn);border-color:#4a3a19;background:#2b2312}
  .chip.bad{color:var(--bad);border-color:#4a1d1d;background:#2b1212}
  .pie{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
       color:var(--dim);font-size:12px;flex-wrap:wrap;gap:10px}
  .aviso{padding:26px;text-align:center;color:var(--dim)}
  .aviso.err{color:#fca5a5}
  .mini{font-size:11.5px;color:var(--dim2)}
  svg.chart{width:100%;height:190px;display:block}
  .leyenda{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
  .leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .acc-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
           padding:10px 12px;margin-bottom:7px;text-align:left;border-radius:8px;
           background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:13px}
  .acc-btn:hover{border-color:var(--acc)}
  .acc-btn .go{color:var(--dim2);font-size:16px}
  .acc-btn.run{opacity:.6;cursor:wait}
  .salida{margin-top:10px;padding:10px 12px;border-radius:8px;background:#0f1622;
          border:1px solid var(--line);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
          white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;color:var(--dim)}
  .salida.ok{border-color:#1d4a2e;color:#86efac}
  .salida.err{border-color:#4a1d1d;color:#fca5a5}
  .medidor{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
  .medidor .v{font-size:29px;font-weight:650;letter-spacing:-.8px}
  .medidor .m{font-size:11px;color:var(--dim2)}
  .tmini{width:100%;border-collapse:collapse;font-size:12.5px}
  .tmini th{background:transparent;padding:5px 6px;font-size:10px;position:static}
  .tmini td{padding:5px 6px;border-top:1px solid var(--line);white-space:nowrap}
  .tmini td.n{text-align:right;font-variant-numeric:tabular-nums}
  .ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
  .fase label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;
              letter-spacing:.6px;margin:13px 0 5px;font-weight:600}
  .fase input,.fase select,.fase textarea{width:100%;background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;font:inherit}
  .fase textarea{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .ops{display:flex;gap:7px;flex-wrap:wrap}
  .op{flex:1;min-width:110px;padding:9px;border-radius:7px;border:1px solid var(--line);
      background:var(--panel2);color:var(--dim);font-size:13px}
  .op.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
  .pasos{display:flex;gap:5px;margin-bottom:6px}
  .pasos i{flex:1;height:3px;border-radius:2px;background:#212b3d}
  .pasos i.on{background:var(--acc)}
  @media(max-width:640px){ main{padding:12px} .kpi .n{font-size:21px} }
</style>
</head>
<body>
<header>
  <h1>ITSANET <b>IMS</b> · Centro de Mando</h1>
  <select id="base" title="Sede">
    <option value="">Todas las sedes</option>
    <option value="UIO">Quito (UIO)</option>
    <option value="GYE">Guayaquil (GYE)</option>
  </select>
  <button id="refrescar" title="Volver a consultar">↻</button>
  <div class="estado"><span class="punto" id="punto"></span><span id="estado-txt">conectando…</span></div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <div class="tabs">
    <button class="tab on" data-v="resumen">Resumen ejecutivo</button>
    <button class="tab" data-v="clientes">Clientes y efectividad</button>
    <button class="tab" data-v="calidad">Calidad y precisión</button>
    <button class="tab" data-v="operacion">Operación y cumplimiento</button>
    <button class="tab" data-v="datos">Explorar datos</button>
    <button class="tab" data-v="crear">Crear inventario</button>
    <button class="tab" data-v="acciones">Acciones</button>
  </div>

  <section id="v-resumen"><div class="grid" id="g-resumen"></div></section>
  <section id="v-clientes" hidden><div class="grid" id="g-clientes"></div></section>
  <section id="v-calidad" hidden><div class="grid" id="g-calidad"></div></section>
  <section id="v-operacion" hidden><div class="grid" id="g-operacion"></div></section>

  <section id="v-crear" hidden>
    <div class="grid ancho" style="max-width:820px">
      <div class="card">
        <h3>Nuevo inventario<span id="paso-txt">paso 1 de 4</span></h3>

        <div class="pasos" id="pasos"></div>

        <!-- 1. Identificación -->
        <div class="fase" data-f="1">
          <label>Cliente *</label>
          <input id="c-cliente" list="lista-clientes" placeholder="Ej. FLUKE" autocomplete="off">
          <datalist id="lista-clientes"></datalist>
          <label>Nombre del archivo *</label>
          <input id="c-nombre" placeholder="260830_FLUKE">
          <p class="mini" id="c-sugerido"></p>
        </div>

        <!-- 2. Fuente de datos -->
        <div class="fase" data-f="2" hidden>
          <label>¿De dónde salen los datos?</label>
          <div class="ops" id="c-fuente">
            <button class="op on" data-v="BLANK">En blanco</button>
            <button class="op" data-v="API">API ITSANET</button>
            <button class="op" data-v="CSV">Pegar CSV</button>
          </div>

          <div id="c-api" hidden>
            <label>Mes del cronograma de códigos</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <select id="c-mes"></select>
              <button id="c-sugerir">Sugerir códigos</button>
            </div>
            <label>Códigos a contar (uno por línea, opcional)</label>
            <textarea id="c-codigos" rows="5" placeholder="Vacío = todo el stock del cliente"></textarea>
            <label style="display:flex;align-items:center;gap:8px;font-weight:400">
              <input type="checkbox" id="c-variantes" checked style="width:auto"> Incluir variantes con sufijo
            </label>
            <button id="c-extraer" class="pri">Extraer stock desde la API</button>
          </div>

          <div id="c-csv" hidden>
            <label>Pega aquí los datos (17 columnas, separadas por tabulación)</label>
            <textarea id="c-csvdata" rows="7" placeholder="Pega desde Excel…"></textarea>
          </div>

          <div class="salida" id="c-salida" hidden></div>
        </div>

        <!-- 3. Carpeta destino -->
        <div class="fase" data-f="3" hidden>
          <label>Carpeta destino en Drive</label>
          <select id="c-carpeta"><option value="">Cargando…</option></select>
          <p class="mini">El archivo se crea dentro de la carpeta seleccionada.</p>
        </div>

        <!-- 4. Confirmación -->
        <div class="fase" data-f="4" hidden>
          <div id="c-resumen"></div>
          <div class="salida" id="c-final" hidden></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          <button id="c-atras">‹ Atrás</button>
          <button id="c-sig" class="pri">Siguiente ›</button>
          <button id="c-crear" class="pri" hidden>✓ Crear inventario</button>
        </div>
      </div>
    </div>
  </section>

  <section id="v-acciones" hidden><div class="grid" id="g-acciones"></div></section>

  <section id="v-datos" hidden>
    <div class="barra">
      <select id="tabla">
        <option value="panel_de_control">Panel de Control</option>
        <option value="inventarios">Inventarios (conteos)</option>
        <option value="cronograma">Cronograma (eventos)</option>
        <option value="registro">Registro (bitácora)</option>
        <option value="equipo">Equipo</option>
        <option value="clientes">Clientes</option>
      </select>
      <input id="cliente" placeholder="Filtrar por cliente (ej. FLUKE)" size="24">
      <button id="buscar" class="pri">Buscar</button>
      <button id="limpiar">Limpiar</button>
    </div>
    <div class="tabla-wrap">
      <div id="contenido" class="aviso">Cargando…</div>
      <div class="pie">
        <span id="info">—</span>
        <span><button id="prev">‹ Anterior</button> <button id="next">Siguiente ›</button></span>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const LIMITE = 50;
let offset = 0, total = 0, datos = null;

const num = (n) => (n ?? 0).toLocaleString("es-EC");
const pct = (v) => (v === null || v === undefined ? "—" : Math.round(v) + "%");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(ruta) {
  const r = await fetch(ruta, { headers: { Accept: "application/json" } });
  const c = await r.json().catch(() => null);
  if (!r.ok) throw new Error((c && (typeof c.error === "string" ? c.error : JSON.stringify(c.error))) || `HTTP ${r.status}`);
  return c;
}

/* ── Tarjeta de lista con barras proporcionales ── */
function lista(titulo, filas, o = {}) {
  const { valor = (f) => f.n, etiq = (f) => f.nombre, suf = "", clase, nota = "", max: tope } = o;
  if (!filas || !filas.length)
    return `<div class="card"><h3>${titulo}</h3><p class="mini">Sin datos.</p></div>`;
  const max = tope || Math.max(...filas.map((f) => Number(valor(f)) || 0), 1);
  const cuerpo = filas.slice(0, o.limite || 12).map((f) => {
    const v = Number(valor(f)) || 0;
    return `<div class="fila"><span>${esc(etiq(f))}</span><b>${num(v)}${suf}</b>` +
           `<span class="bar ${clase ? clase(f) : ""}"><i style="width:${Math.min(100, (v / max) * 100)}%"></i></span></div>`;
  }).join("");
  return `<div class="card"><h3>${titulo}${nota ? `<span>${nota}</span>` : ""}</h3>${cuerpo}</div>`;
}

/* ── Gráfico de barras mensual (SVG puro, sin librerías) ── */
function grafico(titulo, series, datosMes, nota) {
  const W = 640, H = 190, mI = 34, mD = 8, mS = 12, mB = 24;
  const n = datosMes.length;
  const max = Math.max(...datosMes.flatMap((d) => series.map((s) => d[s.campo] || 0)), 1);
  const aW = (W - mI - mD) / n;
  const bW = Math.max(3, (aW - 6) / series.length);
  const y = (v) => H - mB - ((H - mS - mB) * (v / max));

  let g = "";
  for (let i = 0; i <= 3; i++) {           // rejilla
    const v = (max / 3) * i, yy = y(v);
    g += `<line x1="${mI}" y1="${yy}" x2="${W - mD}" y2="${yy}" stroke="#212b3d" stroke-width="1"/>` +
         `<text x="${mI - 5}" y="${yy + 3.5}" fill="#5d6b87" font-size="9" text-anchor="end">${Math.round(v)}</text>`;
  }
  datosMes.forEach((d, i) => {
    const x0 = mI + i * aW + 3;
    series.forEach((s, j) => {
      const v = d[s.campo] || 0, yy = y(v), alto = Math.max(0, H - mB - yy);
      g += `<rect x="${x0 + j * bW}" y="${yy}" width="${bW - 1}" height="${alto}" fill="${s.color}" rx="1.5">` +
           `<title>${d.mes}: ${num(v)} ${s.nombre}</title></rect>`;
    });
    g += `<text x="${mI + i * aW + aW / 2}" y="${H - 8}" fill="#5d6b87" font-size="9.5" text-anchor="middle">${d.mes}</text>`;
  });
  const leyenda = series.map((s) => `<span><i style="background:${s.color}"></i>${s.nombre}</span>`).join("");
  return `<div class="card"><h3>${titulo}${nota ? `<span>${nota}</span>` : ""}</h3>` +
         `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>` +
         `<div class="leyenda">${leyenda}</div></div>`;
}

function kpi(n, l, s, c) {
  return `<div class="kpi ${c || ""}"><div class="n">${n}</div><div class="l">${l}</div>` +
         (s ? `<div class="s">${s}</div>` : "") + `</div>`;
}

async function cargarAnalitica() {
  const base = $("#base").value;
  $("#punto").className = "punto";
  $("#estado-txt").textContent = "consultando…";
  try {
    const d = await api(`/api/proxy?ruta=analitica${base ? "&base=" + base : ""}`);
    datos = d;
    const k = d.kpis, t = d.totales;
    $("#punto").className = "punto ok";
    $("#estado-txt").textContent = "conectado · " + new Date(d.actualizado).toLocaleTimeString("es-EC");

    $("#kpis").innerHTML =
      kpi(num(k.vencidos), "Vencidos", "cronograma", k.vencidos ? "bad" : "ok") +
      kpi(num(k.hoy), "Hoy", "programados", "acc") +
      kpi(num(k.prox7), "Próx. 7 días", "en agenda") +
      kpi(num(k.entregadosAnio), "Entregados año", "cronograma", "ok") +
      kpi(pct(k.avanceMes), "Avance mes", "entregados/prog.", k.avanceMes >= 80 ? "ok" : k.avanceMes < 50 ? "bad" : "warn") +
      kpi(pct(k.cumplimientoAnio), "Cumplimiento año", "prog. vs ejec.", k.cumplimientoAnio >= 80 ? "ok" : "warn") +
      kpi(num(k.clientesActivos), "Clientes", "con inventarios") +
      kpi(num(k.unidadesAnio), "Unidades año", "contadas", "acc");

    /* Resumen ejecutivo */
    $("#g-resumen").innerHTML =
      grafico("Tendencia del año · inventarios y cronograma", [
        { campo: "inventarios", nombre: "Inventarios", color: "#3b82f6" },
        { campo: "programados", nombre: "Programados", color: "#a78bfa" },
        { campo: "entregados", nombre: "Entregados", color: "#22c55e" }
      ], d.tendencia, "por mes") +
      grafico("Unidades contadas por mes", [
        { campo: "unidades", nombre: "Unidades", color: "#3b82f6" }
      ], d.tendencia) +
      lista("Alertas · eventos atrasados", d.atrasados,
        { valor: (f) => f.dias, etiq: (f) => `${f.cliente || "—"} · ${f.responsable}`,
          suf: " d", clase: () => "bad", nota: d.atrasados.length + " atrasados", limite: 10 }) +
      lista("Inventarios por estado", d.estadosPanel, { nota: num(t.inventarios) + " en total" });

    /* Clientes */
    $("#g-clientes").innerHTML =
      lista("Unidades por cliente", d.clientes,
        { valor: (f) => f.unidades, etiq: (f) => f.cliente, nota: "acumulado" }) +
      lista("Efectividad por cliente", d.clientes.filter((c) => c.efectividad !== null)
        .sort((a, b) => b.efectividad - a.efectividad),
        { valor: (f) => Math.round(f.efectividad), etiq: (f) => f.cliente, suf: "%", max: 100,
          clase: (f) => (f.efectividad >= 95 ? "ok" : f.efectividad < 80 ? "bad" : "warn"),
          nota: "media de unidades" }) +
      lista("Inventarios por cliente", d.clientes,
        { valor: (f) => f.inventarios, etiq: (f) => f.cliente }) +
      lista("Posiciones contadas por cliente", d.clientes.filter((c) => c.posiciones > 0)
        .sort((a, b) => b.posiciones - a.posiciones),
        { valor: (f) => f.posiciones, etiq: (f) => f.cliente });

    /* Operación */
    $("#g-operacion").innerHTML =
      lista("Carga por responsable", d.responsables,
        { valor: (f) => f.total, etiq: (f) => f.responsable, nota: "eventos asignados" }) +
      lista("Cumplimiento por responsable", d.responsables.filter((r) => r.cumplimiento !== null)
        .sort((a, b) => b.cumplimiento - a.cumplimiento),
        { valor: (f) => f.cumplimiento, etiq: (f) => f.responsable, suf: "%", max: 100,
          clase: (f) => (f.cumplimiento >= 90 ? "ok" : f.cumplimiento < 60 ? "bad" : "warn") }) +
      lista("Pendientes atrasados", d.responsables.filter((r) => r.atrasados > 0)
        .sort((a, b) => b.atrasados - a.atrasados),
        { valor: (f) => f.atrasados, etiq: (f) => f.responsable, clase: () => "bad",
          nota: k.sinResponsable ? k.sinResponsable + " sin asignar" : "" }) +
      lista("Eventos por estado", d.estadosCronograma, { nota: num(t.eventos) + " en total" }) +
      lista("Eventos por categoría", d.categorias);
  } catch (e) {
    $("#punto").className = "punto bad";
    $("#estado-txt").textContent = "sin conexión";
    const err = `<div class="card"><h3>Error</h3><p class="mini">${esc(e.message)}</p></div>`;
    ["#g-resumen", "#g-clientes", "#g-operacion"].forEach((s) => ($(s).innerHTML = err));
  }
}

/* ── Explorador de datos ── */
function celda(v) {
  if (v === null || v === undefined || v === "") return '<span style="color:#3f4a63">—</span>';
  const s = String(v);
  if (/^https?:\/\//.test(s)) return `<a href="${esc(s)}" target="_blank" rel="noopener">abrir</a>`;
  if (/^(entregado|completado|ok)$/i.test(s)) return `<span class="chip ok">${esc(s)}</span>`;
  if (/^(en curso|en proceso|programado|pendiente)$/i.test(s)) return `<span class="chip warn">${esc(s)}</span>`;
  if (/^(vencido|atrasado)$/i.test(s)) return `<span class="chip bad">${esc(s)}</span>`;
  return esc(s.length > 60 ? s.slice(0, 60) + "…" : s);
}

async function cargarTabla() {
  const tabla = $("#tabla").value, cli = $("#cliente").value.trim().toUpperCase(), base = $("#base").value;
  const p = new URLSearchParams({ limit: LIMITE, offset });
  if (cli) p.set(tabla === "clientes" || tabla === "equipo" ? "nombre" : "cliente", cli);
  if (base) p.set("base", base);
  $("#contenido").className = "aviso";
  $("#contenido").textContent = "Cargando…";
  try {
    const d = await api(`/api/proxy?ruta=${tabla}&${p}`);
    total = d.total ?? 0;
    const filas = d.datos || [];
    if (!filas.length) $("#contenido").textContent = "Sin resultados para este filtro.";
    else {
      const cols = Object.keys(filas[0]).filter((c) => c !== "creado_en");
      $("#contenido").className = "";
      $("#contenido").innerHTML =
        `<table><thead><tr>${cols.map((c) => `<th>${esc(c.replace(/_/g, " "))}</th>`).join("")}</tr></thead><tbody>` +
        filas.map((f) => `<tr>${cols.map((c) => `<td>${celda(f[c])}</td>`).join("")}</tr>`).join("") +
        `</tbody></table>`;
    }
    $("#info").textContent = `${num(total ? offset + 1 : 0)}–${num(Math.min(offset + LIMITE, total))} de ${num(total)}`;
    $("#prev").disabled = offset === 0;
    $("#next").disabled = offset + LIMITE >= total;
  } catch (e) {
    $("#contenido").className = "aviso err";
    $("#contenido").textContent = "Error: " + e.message;
  }
}

/* ── Calidad y precisión (equivalente a los tableros de Power BI) ── */
let calidadCargada = false;

function medidor(titulo, valor, meta) {
  const c = valor === null ? "" : valor >= meta ? "ok-t" : valor >= meta - 1 ? "warn-t" : "bad-t";
  const dif = valor === null ? "" :
    (valor >= meta ? "+" : "") + (valor - meta).toFixed(2) + " vs meta";
  return `<div class="card"><h3>${titulo}<span>meta ${meta}%</span></h3>
    <div class="medidor"><span class="v ${c}">${valor === null ? "—" : valor.toFixed(2) + "%"}</span>
    <span class="m">${dif}</span></div>
    <span class="bar ${c === "ok-t" ? "ok" : c === "bad-t" ? "bad" : "warn"}">
      <i style="width:${valor === null ? 0 : Math.max(0, Math.min(100, (valor - 95) * 20))}%"></i></span></div>`;
}

function tablaMeses(meses, meta) {
  if (!meses.length) return `<div class="card"><h3>Exactitud mensual</h3><p class="mini">Sin datos del año.</p></div>`;
  const fila = (m) => {
    const c = (v) => v === null ? "" : v >= meta ? "ok-t" : "bad-t";
    return `<tr><td>${m.mes}</td>
      <td class="n">${num(m.codigos)}</td><td class="n ${c(m.ef_codigos)}">${m.ef_codigos === null ? "—" : m.ef_codigos.toFixed(2) + "%"}</td>
      <td class="n">${num(Math.round(m.unidades))}</td><td class="n ${c(m.ef_unidades)}">${m.ef_unidades === null ? "—" : m.ef_unidades.toFixed(2) + "%"}</td>
      <td class="n ${c(m.ef_posiciones)}">${m.ef_posiciones === null ? "—" : m.ef_posiciones.toFixed(2) + "%"}</td></tr>`;
  };
  return `<div class="card"><h3>Exactitud mensual<span>códigos · unidades · ubicación</span></h3>
    <div style="overflow-x:auto"><table class="tmini"><thead><tr>
      <th>Mes</th><th style="text-align:right">Códigos</th><th style="text-align:right">% Cód.</th>
      <th style="text-align:right">Unidades</th><th style="text-align:right">% Und.</th>
      <th style="text-align:right">% Ubic.</th></tr></thead>
      <tbody>${meses.map(fila).join("")}</tbody></table></div></div>`;
}

async function cargarCalidad() {
  if (calidadCargada) return;
  const base = $("#base").value;
  $("#g-calidad").innerHTML = '<div class="card"><p class="mini">Calculando…</p></div>';
  try {
    const d = await api(`/api/proxy?ruta=calidad${base ? "&base=" + base : ""}`);
    const t = d.totales, meta = d.meta;

    $("#g-calidad").innerHTML =
      medidor("Fidelidad de unidades", t.ef_unidades, meta) +
      medidor("Fidelidad de SKU", t.ef_codigos, meta) +
      medidor("Fidelidad de ubicación", t.ef_posiciones, meta) +
      `<div class="card"><h3>Discrepancia acumulada<span>${d.anio}</span></h3>
        <div class="medidor"><span class="v ${t.discrepancia > 0.5 ? "bad-t" : "ok-t"}">
        ${t.discrepancia === null ? "—" : t.discrepancia.toFixed(2) + "%"}</span>
        <span class="m">${num(Math.round(t.desfase))} und. de desfase</span></div>
        <div class="fila"><span>Clientes bajo la meta</span><b class="${t.bajoMeta ? "bad-t" : "ok-t"}">${t.bajoMeta}</b></div>
        <div class="fila"><span>Líneas con discrepancia</span><b>${num(t.lineas - t.lineas_ok)}</b></div></div>` +
      tablaMeses(d.meses, meta) +
      grafico("Evolución de unidades auditadas", [
        { campo: "unidades", nombre: "Unidades", color: "#3b82f6" }
      ], d.meses.map((m) => ({ ...m, unidades: Math.round(m.unidades) })), d.anio) +
      lista("Causas de discrepancia", d.motivos,
        { valor: (f) => f.incidencias, etiq: (f) => f.motivo, clase: () => "bad",
          nota: "análisis histórico", limite: 14 }) +
      lista("Estado de gestión", d.justificaciones,
        { valor: (f) => f.incidencias, etiq: (f) => f.justificacion, clase: () => "warn" }) +
      lista("Clientes bajo la meta", d.clientes.filter((c) => c.ef_unidades !== null && c.ef_unidades < meta)
        .sort((a, b) => a.ef_unidades - b.ef_unidades),
        { valor: (f) => Number(f.ef_unidades.toFixed(2)), etiq: (f) => f.cliente, suf: "%",
          max: 100, clase: () => "bad", nota: "exactitud por unidades" }) +
      lista("Confiabilidad por cliente", d.clientes.filter((c) => c.ef_unidades !== null)
        .sort((a, b) => b.ef_unidades - a.ef_unidades),
        { valor: (f) => Number(f.ef_unidades.toFixed(2)), etiq: (f) => f.cliente, suf: "%", max: 100,
          clase: (f) => (f.ef_unidades >= meta ? "ok" : "bad"), limite: 20 });
    calidadCargada = true;
  } catch (e) {
    $("#g-calidad").innerHTML =
      `<div class="card"><h3>Error</h3><p class="mini">${esc(e.message)}</p></div>`;
  }
}

/* ── Acciones remotas (se ejecutan en Apps Script) ── */
let accionesCargadas = false;

async function cargarAcciones() {
  if (accionesCargadas) return;
  $("#g-acciones").innerHTML = '<div class="card"><p class="mini">Cargando…</p></div>';
  try {
    const d = await api("/api/proxy?ruta=acciones");
    if (!d.disponible) {
      $("#g-acciones").innerHTML =
        '<div class="card"><h3>Puente no configurado</h3><p class="mini">' +
        'Falta definir PUENTE_URL y PUENTE_SECRETO en Railway. Mientras tanto, ' +
        'estas acciones se ejecutan desde el Centro de Mando en Apps Script.</p></div>';
      accionesCargadas = true;
      return;
    }
    const grupos = {};
    for (const a of d.acciones) (grupos[a.grupo] ||= []).push(a);
    $("#g-acciones").innerHTML = Object.entries(grupos).map(([g, lista]) =>
      `<div class="card"><h3>${esc(g)}</h3>` +
      lista.map((a) =>
        `<button class="acc-btn" data-id="${esc(a.id)}">${esc(a.nombre)}<span class="go">›</span></button>`
      ).join("") +
      `<div class="salida" id="out-${esc(g).replace(/\s/g, "")}" hidden></div></div>`
    ).join("");

    document.querySelectorAll(".acc-btn").forEach((b) => {
      b.onclick = async () => {
        const salida = b.closest(".card").querySelector(".salida");
        const etiqueta = b.textContent.replace("›", "").trim();
        b.classList.add("run"); b.disabled = true;
        salida.hidden = false; salida.className = "salida";
        salida.textContent = `Ejecutando "${etiqueta}"…`;
        try {
          const r = await fetch(`/api/proxy?ruta=accion/${b.dataset.id}`, { method: "POST" });
          const j = await r.json().catch(() => null);
          const bien = r.ok && j && j.ok !== false;
          salida.className = "salida " + (bien ? "ok" : "err");
          salida.textContent = (bien ? "✓ " : "✕ ") + etiqueta + "\n" +
            JSON.stringify(j && (j.resultado ?? j), null, 2).slice(0, 2000);
          if (bien) { datos = null; cargarAnalitica(); }
        } catch (e) {
          salida.className = "salida err";
          salida.textContent = "✕ " + e.message;
        } finally { b.classList.remove("run"); b.disabled = false; }
      };
    });
    accionesCargadas = true;
  } catch (e) {
    $("#g-acciones").innerHTML =
      `<div class="card"><h3>Error</h3><p class="mini">${esc(e.message)}</p></div>`;
  }
}

/* ── Asistente de creación de inventarios ─────────────────────────────────
   Envía exactamente el mismo payload que el asistente de Apps Script, así que
   el archivo se crea con la lógica ya probada (procesarCreacionArchivoIntegral). */
const cr = { paso: 1, fuente: "BLANK", filas: null, carpetas: [], iniciado: false };
const MESES_N = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO",
                 "JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

async function accion(id, params) {
  const r = await fetch(`/api/proxy?ruta=accion/${id}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(params || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) {
    throw new Error((j && (j.error || j.detalle)) || `HTTP ${r.status}`);
  }
  return j.resultado !== undefined ? j.resultado : j;
}

function crPintar() {
  $("#pasos").innerHTML = [1, 2, 3, 4]
    .map((n) => `<i class="${n <= cr.paso ? "on" : ""}"></i>`).join("");
  $("#paso-txt").textContent = `paso ${cr.paso} de 4`;
  document.querySelectorAll(".fase").forEach((f) => (f.hidden = +f.dataset.f !== cr.paso));
  $("#c-atras").disabled = cr.paso === 1;
  $("#c-sig").hidden = cr.paso === 4;
  $("#c-crear").hidden = cr.paso !== 4;
  if (cr.paso === 4) crResumen();
}

function crResumen() {
  const filas = cr.fuente === "BLANK" ? 0 : (cr.filas ? cr.filas.length : 0);
  const carp = cr.carpetas.find((c) => c.id === $("#c-carpeta").value);
  $("#c-resumen").innerHTML =
    `<div class="fila"><span>Cliente</span><b>${esc($("#c-cliente").value.trim().toUpperCase())}</b></div>
     <div class="fila"><span>Archivo</span><b>${esc($("#c-nombre").value.trim())}</b></div>
     <div class="fila"><span>Fuente</span><b>${cr.fuente === "API" ? "API ITSANET" : cr.fuente === "CSV" ? "CSV pegado" : "En blanco"}</b></div>
     <div class="fila"><span>Filas a cargar</span><b>${num(filas)}</b></div>
     <div class="fila"><span>Carpeta</span><b>${esc(carp ? carp.nombre || carp.name : "—")}</b></div>`;
}

function crValidar() {
  if (cr.paso === 1) {
    if (!$("#c-cliente").value.trim()) return "Indica el cliente.";
    if (!$("#c-nombre").value.trim()) return "Indica el nombre del archivo.";
  }
  if (cr.paso === 2) {
    if (cr.fuente === "API" && !cr.filas) return "Extrae el stock desde la API antes de continuar.";
    if (cr.fuente === "CSV") {
      const t = $("#c-csvdata").value.trim();
      if (!t) return "Pega los datos del CSV.";
      cr.filas = t.split(/\r?\n/).filter(Boolean).map((l) => l.split("\t"));
    }
  }
  return null;
}

async function crCargarCarpetas() {
  const sel = $("#c-carpeta");
  try {
    const r = await accion("subcarpetas", {});
    cr.carpetas = Array.isArray(r) ? r : (r && r.carpetas) || [];
    sel.innerHTML = cr.carpetas.length
      ? cr.carpetas.map((c) => `<option value="${esc(c.id)}">${esc(c.nombre || c.name || c.id)}</option>`).join("")
      : '<option value="">(sin subcarpetas: se usará la raíz)</option>';
  } catch (e) {
    sel.innerHTML = `<option value="">Error: ${esc(e.message)}</option>`;
  }
}

async function crIniciar() {
  if (cr.iniciado) return;
  cr.iniciado = true;
  $("#c-mes").innerHTML = MESES_N.map((m, i) =>
    `<option value="${m}"${i === new Date().getMonth() ? " selected" : ""}>${m}</option>`).join("");
  const hoy = new Date();
  const yy = String(hoy.getFullYear()).slice(2),
        mm = String(hoy.getMonth() + 1).padStart(2, "0"),
        dd = String(hoy.getDate()).padStart(2, "0");
  $("#c-sugerido").textContent = `Sugerencia de formato: ${yy}${mm}${dd}_CLIENTE`;
  try {
    const d = await api("/api/proxy?ruta=clientes&limit=500");
    $("#lista-clientes").innerHTML = (d.datos || [])
      .map((c) => `<option value="${esc(c.nombre)}">`).join("");
  } catch (e) {}
  crCargarCarpetas();
  crPintar();
}

document.querySelectorAll("#c-fuente .op").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("#c-fuente .op").forEach((x) => x.classList.toggle("on", x === b));
    cr.fuente = b.dataset.v;
    cr.filas = null;
    $("#c-api").hidden = cr.fuente !== "API";
    $("#c-csv").hidden = cr.fuente !== "CSV";
    $("#c-salida").hidden = true;
  };
});

$("#c-cliente").onblur = () => {
  const c = $("#c-cliente").value.trim().toUpperCase();
  if (c && !$("#c-nombre").value.trim()) {
    const h = new Date();
    $("#c-nombre").value = String(h.getFullYear()).slice(2) +
      String(h.getMonth() + 1).padStart(2, "0") + String(h.getDate()).padStart(2, "0") + "_" + c;
  }
};

$("#c-sugerir").onclick = async () => {
  const o = $("#c-salida"); o.hidden = false; o.className = "salida";
  o.textContent = "Consultando el cronograma de códigos…";
  try {
    const r = await accion("codigos_programados", {
      cliente: $("#c-cliente").value.trim().toUpperCase(), mes: $("#c-mes").value
    });
    if (!r || !r.existe || !r.codigos || !r.codigos.length) {
      o.className = "salida err";
      o.textContent = "No hay códigos programados para ese cliente y mes.";
      return;
    }
    $("#c-codigos").value = r.codigos.join("\n");
    o.className = "salida ok";
    o.textContent = `✓ ${r.total} códigos programados de ${r.mes}.`;
  } catch (e) { o.className = "salida err"; o.textContent = "✕ " + e.message; }
};

$("#c-extraer").onclick = async () => {
  const o = $("#c-salida"); o.hidden = false; o.className = "salida";
  o.textContent = "Extrayendo stock del ERP… (puede tardar)";
  $("#c-extraer").disabled = true;
  try {
    const codigos = $("#c-codigos").value.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    const r = await accion("previsualizar_stock", {
      cliente: $("#c-cliente").value.trim().toUpperCase(),
      codigos: codigos.length ? codigos : null,
      variantes: $("#c-variantes").checked
    });
    cr.filas = (r && r.datosLimpios) || null;
    if (!cr.filas || !cr.filas.length) throw new Error("La API no devolvió filas.");
    const rep = (r && r.reporte) || {};
    o.className = "salida ok";
    o.textContent = `✓ ${num(cr.filas.length)} filas listas\n` +
      `SKUs únicos: ${num(rep.skusUnicosCount || 0)} · unidades: ${num(rep.sumaCantidad || 0)}\n` +
      `Con serie: ${num(rep.filasConSerie || 0)} · sin serie: ${num(rep.filasSinSerie || 0)}` +
      (rep.excluidas ? `\nExcluidas: ${num(rep.excluidas)}` : "");
  } catch (e) {
    cr.filas = null;
    o.className = "salida err"; o.textContent = "✕ " + e.message;
  } finally { $("#c-extraer").disabled = false; }
};

$("#c-atras").onclick = () => { if (cr.paso > 1) { cr.paso--; crPintar(); } };
$("#c-sig").onclick = () => {
  const err = crValidar();
  if (err) {
    const o = $("#c-salida");
    if (cr.paso === 2) { o.hidden = false; o.className = "salida err"; o.textContent = "✕ " + err; }
    else alert(err);
    return;
  }
  if (cr.paso < 4) { cr.paso++; crPintar(); }
};

$("#c-crear").onclick = async () => {
  const o = $("#c-final"); o.hidden = false; o.className = "salida";
  o.textContent = "Creando el archivo en Drive… no cierres esta pestaña.";
  $("#c-crear").disabled = true;
  try {
    // Misma forma de payload que usa el asistente de Apps Script.
    const datos = {
      clientName: $("#c-cliente").value.trim().toUpperCase(),
      fileName: $("#c-nombre").value.trim(),
      dataSource: cr.fuente === "API" ? "CSV" : cr.fuente,   // la API ya viene en 17 columnas
      folderId: $("#c-carpeta").value || null,
      csvData: cr.fuente === "BLANK" ? null : cr.filas,
      codigosNoEncontrados: [],
      eventoAsignacion: { modo: "ninguno", filaEvento: null, datosEvento: null }
    };
    const r = await accion("crear_inventario", { datos });
    o.className = "salida ok";
    o.textContent = "✓ Inventario creado\n" + JSON.stringify(r, null, 2).slice(0, 1200);
    if (r && r.fileUrl) {
      o.innerHTML += `<br><br><a href="${esc(r.fileUrl)}" target="_blank" rel="noopener">Abrir el archivo ›</a>`;
    }
    cargarAnalitica();
  } catch (e) {
    o.className = "salida err"; o.textContent = "✕ " + e.message;
  } finally { $("#c-crear").disabled = false; }
};

/* ── Navegación ── */
let vista = "resumen";
document.querySelectorAll(".tab").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    vista = b.dataset.v;
    ["resumen", "clientes", "calidad", "operacion", "datos", "crear", "acciones"].forEach(
      (v) => ($("#v-" + v).hidden = v !== vista));
    if (vista === "datos" && !datos) cargarTabla();
    if (vista === "acciones") cargarAcciones();
    if (vista === "calidad") cargarCalidad();
    if (vista === "crear") crIniciar();
  };
});
$("#base").onchange = () => { offset = 0; calidadCargada = false; cargarAnalitica();
  if (vista === "datos") cargarTabla(); if (vista === "calidad") cargarCalidad(); };
$("#refrescar").onclick = () => { calidadCargada = false; cargarAnalitica();
  if (vista === "datos") cargarTabla(); if (vista === "calidad") cargarCalidad(); };
$("#buscar").onclick = () => { offset = 0; cargarTabla(); };
$("#limpiar").onclick = () => { $("#cliente").value = ""; offset = 0; cargarTabla(); };
$("#tabla").onchange = () => { offset = 0; cargarTabla(); };
$("#cliente").onkeydown = (e) => { if (e.key === "Enter") { offset = 0; cargarTabla(); } };
$("#prev").onclick = () => { offset = Math.max(0, offset - LIMITE); cargarTabla(); };
$("#next").onclick = () => { if (offset + LIMITE < total) { offset += LIMITE; cargarTabla(); } };

cargarAnalitica();
cargarTabla();
</script>
