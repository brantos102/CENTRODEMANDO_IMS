<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITSANET IMS — Centro de Mando</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2d; --line:#26304a; --txt:#e8edf7; --dim:#93a0bd;
    --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);
         padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.3px}
  .sede{font-size:11px;color:var(--dim);border:1px solid var(--line);
        padding:3px 9px;border-radius:99px}
  .estado{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .punto.ok{background:var(--ok)} .punto.bad{background:var(--bad)}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .tile .n{font-size:28px;font-weight:600;letter-spacing:-.5px}
  .tile .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
                      border-radius:7px;padding:8px 11px;font:inherit}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{cursor:pointer;background:var(--accent);border-color:var(--accent);font-weight:500}
  button:hover{filter:brightness(1.1)}
  button.sec{background:var(--panel);border-color:var(--line)}
  .tabla-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th{background:#1c2537;color:var(--dim);text-align:left;padding:10px 12px;
     font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  td{padding:9px 12px;border-top:1px solid var(--line)}
  tr:hover td{background:#1a2233}
  .chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
  .chip.ok{color:var(--ok);border-color:#1d4a2e;background:#122b1c}
  .chip.warn{color:var(--warn);border-color:#4a3a19;background:#2b2312}
  .pie{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
       color:var(--dim);font-size:12px;flex-wrap:wrap;gap:10px}
  .aviso{padding:26px;text-align:center;color:var(--dim)}
  .aviso.err{color:#fca5a5}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 15px;border-radius:8px;border:1px solid var(--line);
       background:var(--panel);cursor:pointer;font-size:13px;color:var(--dim)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h3{margin:0 0 13px;font-size:12px;color:var(--dim);
           text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .fila{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;
        padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .fila:first-of-type{border-top:0}
  .fila b{font-variant-numeric:tabular-nums;font-weight:600}
  .barra-v{height:5px;border-radius:3px;background:#243049;overflow:hidden;grid-column:1/-1}
  .barra-v>i{display:block;height:100%;background:var(--accent)}
  .barra-v.ok>i{background:var(--ok)} .barra-v.bad>i{background:var(--bad)}
  .mini{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>ITSANET IMS · Centro de Mando</h1>
  <span class="sede" id="sede-chip">Quito (UIO)</span>
  <div class="estado"><span class="punto" id="punto"></span><span id="estado-txt">conectando…</span></div>
</header>

<main>
  <section class="tiles" id="tiles"></section>

  <div class="tabs">
    <button class="tab on" data-v="datos">Datos</button>
    <button class="tab" data-v="analisis">Análisis de resultados</button>
    <button class="tab" data-v="operacion">Operación y cumplimiento</button>
  </div>

  <section id="vista-analisis" hidden><div class="grid" id="grid-analisis"></div></section>
  <section id="vista-operacion" hidden><div class="grid" id="grid-operacion"></div></section>

  <div id="vista-datos">
  <div class="barra">
    <select id="tabla">
      <option value="panel_de_control">Panel de Control</option>
      <option value="inventarios">Inventarios (conteos)</option>
      <option value="cronograma">Cronograma (eventos)</option>
      <option value="registro">Registro (bitácora)</option>
      <option value="clientes">Clientes</option>
    </select>
    <input id="cliente" placeholder="Filtrar por cliente (ej. FLUKE)" size="26">
    <select id="base">
      <option value="">Todas las sedes</option>
      <option value="UIO">Quito (UIO)</option>
      <option value="GYE">Guayaquil (GYE)</option>
    </select>
    <button id="buscar">Buscar</button>
    <button id="limpiar" class="sec">Limpiar</button>
  </div>

  <div class="tabla-wrap">
    <div id="contenido" class="aviso">Cargando…</div>
    <div class="pie">
      <span id="info">—</span>
      <span>
        <button class="sec" id="prev">‹ Anterior</button>
        <button class="sec" id="next">Siguiente ›</button>
      </span>
    </div>
  </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const LIMITE = 50;
let offset = 0, total = 0;

const num = (n) => (n ?? 0).toLocaleString("es-EC");

async function api(ruta) {
  const r = await fetch(ruta, { headers: { "Accept": "application/json" } });
  const cuerpo = await r.json().catch(() => null);
  if (!r.ok) {
    const m = cuerpo && (typeof cuerpo.error === "string" ? cuerpo.error : JSON.stringify(cuerpo.error));
    throw new Error(m || `HTTP ${r.status}`);
  }
  return cuerpo;
}

async function cargarResumen() {
  try {
    const d = await api("/api/proxy?ruta=resumen");
    $("#punto").className = "punto ok";
    $("#estado-txt").textContent = "conectado a Supabase";
    $("#tiles").innerHTML = [
      ["Inventarios en curso", d.panel], ["Líneas contadas", d.inventarios],
      ["Movimientos", d.registro], ["Eventos cronograma", d.cronograma], ["Clientes", d.clientes]
    ].map(([l, n]) => `<div class="tile"><div class="n">${num(n)}</div><div class="l">${l}</div></div>`).join("");
  } catch (e) {
    $("#punto").className = "punto bad";
    $("#estado-txt").textContent = "sin conexión: " + e.message;
  }
}

function celda(v) {
  if (v === null || v === undefined || v === "") return '<span style="color:#5a6782">—</span>';
  const s = String(v);
  if (/^https?:\/\//.test(s)) return `<a href="${s}" target="_blank" rel="noopener" style="color:#60a5fa">abrir</a>`;
  if (/^(entregado|completado|ok)$/i.test(s)) return `<span class="chip ok">${s}</span>`;
  if (/^(en curso|programado|pendiente)$/i.test(s)) return `<span class="chip warn">${s}</span>`;
  return s.length > 60 ? s.slice(0, 60) + "…" : s;
}

async function cargarTabla() {
  const tabla = $("#tabla").value, cliente = $("#cliente").value.trim().toUpperCase(), base = $("#base").value;
  const p = new URLSearchParams({ limit: LIMITE, offset });
  if (cliente) p.set(tabla === "clientes" ? "nombre" : "cliente", cliente);
  if (base) p.set("base", base);
  $("#contenido").className = "aviso";
  $("#contenido").textContent = "Cargando…";
  try {
    const d = await api(`/api/proxy?ruta=${tabla}&${p}`);
    total = d.total ?? 0;
    const filas = d.datos || [];
    if (!filas.length) {
      $("#contenido").textContent = "Sin resultados para este filtro.";
    } else {
      const cols = Object.keys(filas[0]).filter((c) => c !== "creado_en");
      $("#contenido").className = "";
      $("#contenido").innerHTML =
        `<table><thead><tr>${cols.map((c) => `<th>${c.replace(/_/g, " ")}</th>`).join("")}</tr></thead>` +
        `<tbody>${filas.map((f) => `<tr>${cols.map((c) => `<td>${celda(f[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    const desde = total ? offset + 1 : 0;
    $("#info").textContent = `${num(desde)}–${num(Math.min(offset + LIMITE, total))} de ${num(total)}`;
    $("#prev").disabled = offset === 0;
    $("#next").disabled = offset + LIMITE >= total;
  } catch (e) {
    $("#contenido").className = "aviso err";
    $("#contenido").textContent = "Error: " + e.message;
  }
}

$("#buscar").onclick = () => { offset = 0; cargarTabla(); };
$("#limpiar").onclick = () => { $("#cliente").value = ""; $("#base").value = ""; offset = 0; cargarTabla(); };
$("#tabla").onchange = () => { offset = 0; cargarTabla(); };
$("#base").onchange  = () => {
  const b = $("#base").value;
  $("#sede-chip").textContent = b === "GYE" ? "Guayaquil (GYE)" : b === "UIO" ? "Quito (UIO)" : "Todas las sedes";
  offset = 0; analisisCargado = false; cargarTabla();
  if (!$("#vista-analisis").hidden || !$("#vista-operacion").hidden) cargarAnalisis();
};
$("#cliente").onkeydown = (e) => { if (e.key === "Enter") { offset = 0; cargarTabla(); } };
$("#prev").onclick = () => { offset = Math.max(0, offset - LIMITE); cargarTabla(); };
$("#next").onclick = () => { if (offset + LIMITE < total) { offset += LIMITE; cargarTabla(); } };

/* ── Análisis (los cálculos llegan ya hechos desde la API) ──────────────── */
let analisisCargado = false;

const pct = (v) => (v === null || v === undefined ? "—" : Math.round(v) + "%");

function listaCard(titulo, filas, opciones = {}) {
  const { valor = (f) => f.n, etiqueta = (f) => f.nombre, sufijo = "", barra = true } = opciones;
  if (!filas || !filas.length) return `<div class="card"><h3>${titulo}</h3><p class="mini">Sin datos.</p></div>`;
  const max = Math.max(...filas.map((f) => Number(valor(f)) || 0), 1);
  const cuerpo = filas.slice(0, 12).map((f) => {
    const v = Number(valor(f)) || 0;
    const clase = opciones.clase ? opciones.clase(f) : "";
    return `<div class="fila"><span>${etiqueta(f)}</span><b>${num(v)}${sufijo}</b>` +
           (barra ? `<span class="barra-v ${clase}"><i style="width:${(v / max) * 100}%"></i></span>` : "") +
           `</div>`;
  }).join("");
  return `<div class="card"><h3>${titulo}</h3>${cuerpo}</div>`;
}

async function cargarAnalisis() {
  if (analisisCargado) return;
  const base = $("#base").value;
  $("#grid-analisis").innerHTML = '<div class="card"><p class="mini">Calculando…</p></div>';
  $("#grid-operacion").innerHTML = '<div class="card"><p class="mini">Calculando…</p></div>';
  try {
    const d = await api(`/api/proxy?ruta=analitica${base ? "&base=" + base : ""}`);
    const t = d.totales || {};

    $("#grid-analisis").innerHTML =
      `<div class="card"><h3>Totales</h3>
        <div class="fila"><span>Unidades contadas</span><b>${num(t.unidades)}</b></div>
        <div class="fila"><span>Inventarios</span><b>${num(t.inventarios)}</b></div>
        <div class="fila"><span>Eventos programados</span><b>${num(t.eventos)}</b></div>
        <div class="fila"><span>Efectividad media</span><b>${pct(t.efectividadMedia)}</b></div>
      </div>` +
      listaCard("Unidades por cliente", d.clientes,
        { valor: (f) => f.unidades, etiqueta: (f) => f.cliente }) +
      listaCard("Efectividad por cliente", (d.clientes || []).filter((c) => c.efectividad !== null)
        .sort((a, b) => b.efectividad - a.efectividad),
        { valor: (f) => Math.round(f.efectividad), etiqueta: (f) => f.cliente, sufijo: "%",
          clase: (f) => (f.efectividad >= 95 ? "ok" : f.efectividad < 80 ? "bad" : "") }) +
      listaCard("Inventarios por estado", d.estadosPanel);

    $("#grid-operacion").innerHTML =
      listaCard("Carga por responsable", d.responsables,
        { valor: (f) => f.total, etiqueta: (f) => f.responsable }) +
      listaCard("Cumplimiento por responsable", (d.responsables || [])
        .filter((r) => r.cumplimiento !== null).sort((a, b) => b.cumplimiento - a.cumplimiento),
        { valor: (f) => f.cumplimiento, etiqueta: (f) => f.responsable, sufijo: "%",
          clase: (f) => (f.cumplimiento >= 90 ? "ok" : f.cumplimiento < 60 ? "bad" : "") }) +
      listaCard("Atrasados por responsable", (d.responsables || [])
        .filter((r) => r.atrasados > 0).sort((a, b) => b.atrasados - a.atrasados),
        { valor: (f) => f.atrasados, etiqueta: (f) => f.responsable, clase: () => "bad" }) +
      listaCard("Eventos por estado", d.estadosCronograma) +
      listaCard("Eventos por categoría", d.categorias);

    analisisCargado = true;
  } catch (e) {
    const err = `<div class="card"><h3>Error</h3><p class="mini">${e.message}</p></div>`;
    $("#grid-analisis").innerHTML = err;
    $("#grid-operacion").innerHTML = err;
  }
}

document.querySelectorAll(".tab").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    const v = b.dataset.v;
    $("#vista-datos").hidden     = v !== "datos";
    $("#vista-analisis").hidden  = v !== "analisis";
    $("#vista-operacion").hidden = v !== "operacion";
    if (v !== "datos") cargarAnalisis();
  };
});

cargarResumen();
cargarTabla();
</script>
</body>
</html>
