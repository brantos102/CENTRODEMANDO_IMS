<script>
/* ====================================================================
   WEB APP — lógica SPA. window.USUARIO viene inyectado desde doGet.
   ==================================================================== */
var U = window.USUARIO || { nombre:'Invitado', rol:'Auditor', permisos:{} };
var P = U.permisos || {};
var estado = null;
var chart = null;
var filtroActual = 'all';
var cronPeriodo = 'semana';   // FIX FASE 8.35: período del Cronograma operativo (semana/mes/all)

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtNum(n){ if(n==null)return '—'; if(n>=1e6)return (n/1e6).toFixed(2)+'M'; if(n>=1e3)return (n/1e3).toFixed(1)+'k'; return Math.round(n).toString(); }

/* ===== FASE 8.62 R2: TEMA DÍA / NOCHE ===== */
function aplicarTema(t) {
  var claro = (t === 'light');
  document.documentElement.setAttribute('data-theme', claro ? 'light' : 'dark');
  try { localStorage.setItem('ims_tema', claro ? 'light' : 'dark'); } catch(e){}
  var b = document.getElementById('theme-toggle');
  if (b) { b.innerText = claro ? '☀️' : '🌙'; b.title = claro ? 'Cambiar a modo noche' : 'Cambiar a modo día'; }
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', claro ? '#f1f5f9' : '#0b1220');
}
function toggleTema() {
  var actual = document.documentElement.getAttribute('data-theme') || 'dark';
  aplicarTema(actual === 'light' ? 'dark' : 'light');
}
// Aplicar de inmediato (antes del render) para evitar parpadeo.
(function(){ try { aplicarTema(localStorage.getItem('ims_tema') || 'dark'); } catch(e){ aplicarTema('dark'); } })();

/* ===== INIT ===== */
window.onload = function() {
  // Header usuario
  $('u-nombre').innerText = U.nombre || U.email;
  $('u-rol').innerText = U.rol;
  $('u-avatar').innerText = (U.nombre || U.email || '?').charAt(0).toUpperCase();
  // FASE 8.65 (R7): foto de perfil si el usuario configuró una.
  if (U.foto) { var _av=$('u-avatar'); if(_av){ _av.style.background='center/cover url('+U.foto+')'; _av.innerText=''; } }

  // Aplicar permisos: ocultar nav/botones según rol
  if (!P.gestionUsuarios) $('nav-usuarios').classList.add('hidden');
  if (!P.verAnalytics)    $('nav-analytics').classList.add('hidden');
  aplicarPermisosBotones();

  // FASE 8.65 (perf): pintar al instante desde caché local (si hay) → sin
  // "1 minuto de módulos vacíos"; luego se refresca con datos frescos.
  var _huboCache = _pintarDesdeCache();
  cargarDashboard(_huboCache ? true : false);  // si ya pinté, la 1ª carga es silenciosa
  iniciarAutoRefresh();
};

function aplicarPermisosBotones() {
  // FASE 8.63 (R6): permisos por MÓDULO.
  //  · Operación: crear/evento/métricas (crearInventario) · libro (abrirLibro) · WMS (todos)
  //  · Base de datos: consolidar/pre-validar/limpiar/cron-códigos/cred-api/accesos → baseDatos
  //  · Reportes y notif.: exportar/record/sinc/syncQ/zip → exportar||recordatorios
  var map = {
    'b-crear': P.crearInventario, 'b-evento': P.crearInventario,
    'b-metricas': P.crearInventario, 'b-libro': P.abrirLibro,
    'b-consolidar': P.baseDatos, 'b-prevalidar': P.baseDatos,
    'b-limpiar': P.baseDatos,
    'b-cron-codigos': P.baseDatos, 'b-cred-api': P.baseDatos, 'b-accesos': P.baseDatos,
    'b-exportar': P.exportar,
    'b-record': P.recordatorios, 'b-sinc': P.recordatorios, 'b-syncQ': P.recordatorios,
    'b-zip': P.exportar,
    'b-cal': P.recordatorios,   // FASE 8.65 R10: sincronizar Calendar (Reportes)
    'b-nuevo-usr': P.crearUsuarios   // FASE 8.65 R4: crear usuarios
  };
  // Oculta (no solo deshabilita) lo que el rol no puede usar → panel limpio por rango.
  Object.keys(map).forEach(function(id){
    var el = $(id);
    if (el) el.style.display = map[id] ? '' : 'none';
  });
  // Poda: oculta cada "actbox" (módulo) que quede sin botones visibles.
  document.querySelectorAll('.actbox').forEach(function(box){
    var btns = box.querySelectorAll('.btn');
    var algunoVisible = false;
    btns.forEach(function(b){ if (b.style.display !== 'none') algunoVisible = true; });
    // No ocultar el bloque "Carga por operario" (no tiene .btn, tiene lista)
    if (btns.length > 0 && !algunoVisible) box.style.display = 'none';
    else box.style.display = '';
  });
}

/* ===== NAVEGACIÓN SPA ===== */
function nav(sec) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  $('sec-' + sec).classList.add('active');
  document.querySelector('.nav button[data-sec="' + sec + '"]').classList.add('active');
  if (sec === 'perfil') cargarPerfil();
  if (sec === 'usuarios') cargarUsuarios();
  if (sec === 'analytics') cargarAnalytics();
  window.scrollTo(0, 0);
}

/* ===== DASHBOARD ===== */
var AUTO_REFRESH_MS = 30000; // FASE 8.61: 30s — auditoría en vivo necesita datos frescos
var _autoTimer = null;

var _dashCargando = false;
function cargarDashboard(silencioso) {
  var scrollY = window.scrollY;
  var qActual = $('f-cliente') ? $('f-cliente').value : '';
  // FASE 8.65 (perf): indicador visible SOLO en carga no silenciosa sin datos.
  if (!silencioso && !estado) _mostrarCargandoDashboard(true);
  if (_dashCargando && silencioso) return;   // no encimar refrescos
  _dashCargando = true;
  google.script.run
    .withSuccessHandler(d => {
      _dashCargando = false;
      estado = d;
      // FIX FASE 8.23: timestamp para invalidar cache del calendario
      estado._cronoStamp = Date.now();
      _calCacheKey = ''; // forzar repintado
      _mostrarCargandoDashboard(false);
      pintarDashboard();
      // FASE 8.65 (perf): cachear el último estado para pintado INSTANTÁNEO
      // en la próxima carga (evita 1 min con módulos vacíos).
      try { localStorage.setItem('ims_estado_cache', JSON.stringify({ t: Date.now(), d: d })); } catch(e){}
      if (silencioso) {
        if ($('f-cliente') && qActual) { $('f-cliente').value = qActual; pintarCron(); }
        window.scrollTo(0, scrollY);
        mostrarIndicadorRefresh();
      }
    })
    .withFailureHandler(err => { _dashCargando = false; _mostrarCargandoDashboard(false); if (!silencioso) toast('Error: ' + err.message, 'error'); })
    .obtenerEstadoIntegralDashboard();
}

/* FASE 8.65 (perf): overlay ligero de "cargando" mientras llega el 1er lote. */
function _mostrarCargandoDashboard(on) {
  var el = document.getElementById('dash-cargando');
  if (on) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'dash-cargando';
      el.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:70;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:12px;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;';
      el.innerHTML = '<span style="width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:imsspin .8s linear infinite;"></span> Cargando datos del panel…';
      var st = document.createElement('style'); st.textContent='@keyframes imsspin{to{transform:rotate(360deg)}}'; el.appendChild(st);
      document.body.appendChild(el);
    }
    el.style.display = 'flex';
  } else if (el) { el.style.display = 'none'; }
}

/* FASE 8.65 (perf): pinta al instante el último estado cacheado (si existe y es
   reciente) para que NO se vea el panel vacío mientras llega el fresco. */
function _pintarDesdeCache() {
  try {
    var raw = localStorage.getItem('ims_estado_cache');
    if (!raw) return false;
    var o = JSON.parse(raw);
    if (!o || !o.d) return false;
    // Solo si es de las últimas 12 h (evita datos rancios)
    if (Date.now() - (o.t||0) > 12*3600*1000) return false;
    estado = o.d; estado._cronoStamp = Date.now(); _calCacheKey='';
    pintarDashboard();
    return true;
  } catch(e){ return false; }
}

function iniciarAutoRefresh() {
  if (_autoTimer) clearInterval(_autoTimer);
  _autoTimer = setInterval(function() {
    if (document.hidden) return;
    if ($('modal').classList.contains('show')) return;
    // FASE 8.60: no refrescar mientras el wizard está abierto (auditoría en curso)
    if (document.getElementById('wizard-modal-overlay')) return;
    // Solo refrescar la sección activa
    var activa = document.querySelector('.section.active');
    if (!activa) return;
    var id = activa.id;
    if (id === 'sec-dashboard') cargarDashboard(true);
    else if (id === 'sec-usuarios') cargarUsuarios();
    else if (id === 'sec-analytics') cargarAnalytics();
    // Perfil no necesita auto-refresh
  }, AUTO_REFRESH_MS);
}

function mostrarIndicadorRefresh() {
  var ind = document.getElementById('refresh-ind');
  if (!ind) {
    ind = document.createElement('div');
    ind.id = 'refresh-ind';
    ind.style.cssText = 'position:fixed;top:60px;right:14px;background:rgba(34,197,94,0.15);color:#86efac;padding:5px 12px;border-radius:14px;font-size:11px;z-index:60;border:1px solid rgba(34,197,94,0.3);opacity:0;transition:opacity 0.3s;font-weight:500;';
    document.body.appendChild(ind);
  }
  ind.innerText = '✓ Actualizado ' + new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  ind.style.opacity = '1';
  clearTimeout(window._indT);
  window._indT = setTimeout(function(){ ind.style.opacity = '0'; }, 2000);
}

function pintarDashboard() {
  if (!estado) return;
  var k = estado.kpis;
  $('kpi-venc').innerText = k.vencidos;
  $('kpi-hoy').innerText = k.hoy;
  $('kpi-prox7').innerText = k.proximos7;
  $('kpi-entr-anio').innerText = k.entregadosAnio;
  $('kpi-cli-act').innerText = k.clientesActivosMes;
  $('kpi-unid').innerText = fmtNum(k.unidades);
  $('kpi-refs').innerText = fmtNum(k.referencias);
  $('kpi-pos').innerText = fmtNum(k.posiciones);
  $('kpi-avance-mes').innerText = Math.round(k.avanceGlobalMes * 100) + '%';
  var totalCronos = estado.cronograma.length;
  $('kpi-cumpl').innerText = Math.round((totalCronos > 0 ? k.entregadosCronos/totalCronos : 0) * 100) + '%';
  // FIX FASE 8.35: el resumen del cronograma lo gestiona pintarCron (refleja el filtro/período).
  pintarChart(); pintarCron(); pintarPan(); pintarCarga();
  pintarConsolidacion();
  pintarActivos();   // FASE 8.65 R5
}

/* FASE 8.65 (R5): widget de usuarios activos ahora mismo (hover = nombres). */
function pintarActivos() {
  var a = (estado && estado.usuariosActivos) ? estado.usuariosActivos : { count:0, nombres:[] };
  var num = $('activos-num'); var box = $('activos-box');
  if (num) num.innerText = a.count;
  if (box) box.title = a.count
    ? ('Activos ahora (' + a.count + '):\n' + (a.nombres || []).join('\n'))
    : 'Sin usuarios activos en los últimos 5 min';
}

/* FIX FASE 8.33: indicador flotante del progreso de la consolidación por lotes.
   Se crea/actualiza dinámicamente (sin tocar el HTML) leyendo estado.consolidacion.
   Solo se muestra mientras una corrida está EN_CURSO; ofrece "Cancelar". */
function pintarConsolidacion() {
  var c = estado && estado.consolidacion;
  var banner = document.getElementById('consol-banner');
  if (!c || !c.enCurso) { if (banner) banner.remove(); return; }
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'consol-banner';
    banner.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;' +
      'background:#131c2e;border:1px solid #283352;border-left:3px solid #f59e0b;border-radius:10px;' +
      'padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,0.45);' +
      'font-size:12px;color:#e8ecf3;max-width:92vw;';
    document.body.appendChild(banner);
  }
  var pct = c.total > 0 ? Math.round((c.procesados / c.total) * 100) : 0;
  banner.innerHTML =
    '<span style="font-size:16px;">⏳</span>' +
    '<div style="min-width:200px;">' +
      '<div style="font-weight:600;margin-bottom:4px;">Consolidación en curso · ' +
        c.procesados + '/' + c.total + ' (' + pct + '%)</div>' +
      '<div style="height:5px;background:#0d1424;border-radius:3px;overflow:hidden;">' +
        '<div style="height:100%;width:' + pct + '%;background:#f59e0b;transition:width .4s;"></div>' +
      '</div>' +
      '<div style="color:#7d8aa8;margin-top:4px;font-size:10.5px;">Termina automáticamente en segundo plano.</div>' +
    '</div>' +
    '<button id="consol-resume" style="background:#1d2c3a;color:#93c5fd;border:1px solid #2b485c;' +
      'padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11px;white-space:nowrap;">Reanudar</button>' +
    '<button id="consol-cancel" style="background:#3a1d1d;color:#fca5a5;border:1px solid #5c2b2b;' +
      'padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11px;white-space:nowrap;">Cancelar</button>';
  var btnR = document.getElementById('consol-resume');
  if (btnR) btnR.onclick = function() {
    btnR.disabled = true; btnR.innerText = '…';
    google.script.run
      .withSuccessHandler(function(r){ toast((r && r.mensaje) || 'Reanudada', 'info'); cargarDashboard(true); })
      .withFailureHandler(function(e){ toast('Error: ' + (e.message || e), 'error'); btnR.disabled = false; btnR.innerText = 'Reanudar'; })
      .dash_continuarConsolidacion();
  };
  var btn = document.getElementById('consol-cancel');
  if (btn) btn.onclick = function() {
    if (!confirm('¿Cancelar la consolidación en curso? Se conservará lo ya consolidado.')) return;
    btn.disabled = true; btn.innerText = '…';
    google.script.run
      .withSuccessHandler(function(r){ toast((r && r.mensaje) || 'Cancelada', 'info'); cargarDashboard(true); })
      .withFailureHandler(function(e){ toast('Error: ' + (e.message || e), 'error'); btn.disabled = false; btn.innerText = 'Cancelar'; })
      .dash_cancelarConsolidacion();
  };
}

function pintarChart() {
  var meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var data = estado.chartAnual;
  // FIX FASE 8.34: serie "Unidades (miles)" reemplazada por "Trabajos Slotting".
  // Solo actualiza el subtítulo si la vista activa es el gráfico (no pisa el del calendario).
  var _ca = $('chart-anio');
  if (_ca && vistaTendActual === 'chart') _ca.innerText = new Date().getFullYear() + ' · inventarios entregados y trabajos de slotting';
  // FIX FASE 8.36 (render): si los datos no cambiaron y el gráfico ya existe, no
  // lo reconstruimos (evita flicker/CPU en el refresco de 60s). El calendario sí
  // se re-evalúa más abajo.
  var _hash = JSON.stringify(data);
  if (chart && _hash === window._chartHash) {
    if (vistaTendActual === 'cal') pintarCalendario();
    return;
  }
  window._chartHash = _hash;
  if (chart) chart.destroy();
  chart = new Chart($('chart-anual').getContext('2d'), {
    type:'line',
    data:{ labels:meses, datasets:[
      { label:'Inventarios entregados', data:data.map(d=>d.invent), borderColor:'#3b82f6',
        backgroundColor:'rgba(59,130,246,0.1)', yAxisID:'y1', tension:0.25, borderWidth:2, pointRadius:3, fill:true },
      { label:'Trabajos Slotting', data:data.map(d=>d.slotting||0), borderColor:'#a855f7',
        backgroundColor:'rgba(168,85,247,0.08)', yAxisID:'y1', tension:0.25, borderWidth:2, pointRadius:3, borderDash:[4,3], fill:false }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{labels:{color:'#e8ecf3',font:{size:11},boxWidth:12,usePointStyle:true}},
        tooltip:{backgroundColor:'#131c2e',borderColor:'#283352',borderWidth:1,titleColor:'#e8ecf3',bodyColor:'#e8ecf3',padding:10}},
      scales:{ x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#7d8aa8',font:{size:10}}},
        y1:{type:'linear',position:'left',beginAtZero:true,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#7d8aa8',font:{size:10},stepSize:1,precision:0},title:{display:true,text:'Eventos (cantidad)',color:'#7d8aa8',font:{size:10}}}}}
  });
  // FIX FASE 8.19: si el calendario estaba activo, re-renderizar con datos frescos
  if (vistaTendActual === 'cal') pintarCalendario();
}

/* ════════════════════════════════════════════════════════════════════
   FIX FASE 8.19: Tabs Tendencia / Calendario Gantt
   Vista calendario muestra mes a mes los eventos del cronograma con
   colores por estado, sin afectar la vista de tendencia (chart).
   ════════════════════════════════════════════════════════════════════ */
// FIX FASE 8.34: calendario primero por defecto, vista semanal por defecto,
// con toggle Semana/Mes, filtro por estado y botón "Hoy".
var vistaTendActual = 'cal';
var calVista = 'semana';                 // 'semana' (default) | 'mes'
var calRef = new Date(); calRef.setHours(0,0,0,0);  // fecha de referencia
var calEstadoFiltro = 'all';             // all | prog | curso | ent | venc
// FIX FASE 8.23: cache del último render para evitar repintado innecesario
var _calCacheKey = '';

function cambiarVistaTendencia(vista) {
  vistaTendActual = vista;
  document.querySelectorAll('.vt-tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-vt') === vista);
  });
  document.querySelectorAll('.vt-pane').forEach(function(p){ p.classList.remove('vt-active'); });
  $('vt-' + vista).classList.add('vt-active');
  if (vista === 'chart') {
    $('tend-titulo').innerHTML = '📈 Tendencia anual <small id="chart-anio">' + (new Date().getFullYear() + ' · inventarios entregados y trabajos de slotting') + '</small>';
    if (chart) { try { chart.resize(); } catch(e){} }   // el canvas estaba oculto
  } else if (vista === 'cal') {
    $('tend-titulo').innerHTML = '📅 Calendario operativo <small id="chart-anio"> · vista por ' + (calVista==='semana'?'semana':'mes') + '</small>';
    pintarCalendario();
  }
}

function calSetVista(v) {
  if (calVista === v) return;
  calVista = v;
  document.querySelectorAll('.cal-vt').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-cv') === v);
  });
  $('tend-titulo').innerHTML = '📅 Calendario operativo <small id="chart-anio"> · vista por ' + (v==='semana'?'semana':'mes') + '</small>';
  _calCacheKey = ''; pintarCalendario();
}

function calSetEstado(v) { calEstadoFiltro = v || 'all'; _calCacheKey = ''; pintarCalendario(); }
/* Función supercargada para el botón "Hoy" del calendario */
function calHoy() { 
  // 1. Establecer la referencia de tiempo a hoy
  calRef = new Date(); 
  calRef.setHours(0,0,0,0); 
  
  // 2. Forzar la vista a 'semana' para mejor visualización
  calVista = 'semana';
  document.querySelectorAll('.cal-vt').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-cv') === 'semana');
  });
  
  // 3. Limpiar caché y repintar el calendario
  _calCacheKey = ''; 
  pintarCalendario(); 
  
  // 4. Resaltar automáticamente la columna del día de hoy
  setTimeout(function() {
    resaltarGantt('col-dia-' + calRef.getTime());
  }, 50);
}


function calMover(delta) {
  if (calVista === 'semana') calRef.setDate(calRef.getDate() + delta * 7);
  else calRef.setMonth(calRef.getMonth() + delta);
  _calCacheKey = ''; pintarCalendario();
}

// Lunes como inicio de semana
function _inicioSemana(fecha) {
  var d = new Date(fecha); d.setHours(0,0,0,0);
  var dow = d.getDay();                   // 0=Dom..6=Sab
  d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
  return d;
}

function pintarCalendario() {
  if (!estado || !estado.cronograma) {
    $('cal-body').innerHTML = '<div class="empty">Sin datos de cronograma.</div>';
    return;
  }
  var nombresMes = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                    'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var mesesAbr = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var diasSemAbr = ['D','L','M','M','J','V','S'];
  var hoy = new Date(); hoy.setHours(0,0,0,0);

  // Rango visible (array de Date a medianoche) según vista
  var dias = [], rangoIni, rangoFin, titulo;
  if (calVista === 'semana') {
    rangoIni = _inicioSemana(calRef);
    for (var i = 0; i < 7; i++) { var dw = new Date(rangoIni); dw.setDate(rangoIni.getDate()+i); dias.push(dw); }
    rangoFin = new Date(dias[6]); rangoFin.setHours(23,59,59,999);
    titulo = dias[0].getDate() + ' ' + mesesAbr[dias[0].getMonth()] + ' – ' +
             dias[6].getDate() + ' ' + mesesAbr[dias[6].getMonth()] + ' ' + dias[6].getFullYear();
  } else {
    var y = calRef.getFullYear(), mm = calRef.getMonth();
    var diasMes = new Date(y, mm+1, 0).getDate();
    for (var j = 1; j <= diasMes; j++) dias.push(new Date(y, mm, j));
    rangoIni = new Date(y, mm, 1);
    rangoFin = new Date(y, mm, diasMes, 23,59,59,999);
    titulo = nombresMes[mm] + ' ' + y;
  }
  $('cal-mes-titulo').innerText = titulo;
  var colW = (calVista === 'semana') ? '78px' : '22px';

  // Cache key
  var cacheKey = calVista + '-' + (+rangoIni) + '-' + calEstadoFiltro + '-' +
                 estado.cronograma.length + '-' + (estado._cronoStamp || 0);
  if (cacheKey === _calCacheKey) return;
  _calCacheKey = cacheKey;

  // Filtrar eventos por rango visible + estado
  var eventos = estado.cronograma.filter(function(d){
    if (!d.fechaInicio) return false;
    var ini = new Date(d.fechaInicio); ini.setHours(0,0,0,0);
    var fin = d.fechaFin ? new Date(d.fechaFin) : new Date(d.fechaInicio); fin.setHours(0,0,0,0);
    if (fin < rangoIni || ini > rangoFin) return false;
    if (calEstadoFiltro !== 'all') {
      var est = String(d.estado||'').toLowerCase();
      var entregado = est.indexOf('entregado')!==-1;
      var enCurso = est.indexOf('curso')!==-1 || est.indexOf('proceso')!==-1;
      var vencido = !entregado && fin < hoy;
      if (calEstadoFiltro==='ent'   && !entregado) return false;
      if (calEstadoFiltro==='curso' && !enCurso)   return false;
      if (calEstadoFiltro==='venc'  && !vencido)   return false;
      if (calEstadoFiltro==='prog'  && (entregado||enCurso||vencido)) return false;
    }
    return true;
  });

  if (eventos.length === 0) {
    $('cal-body').innerHTML = '<div class="empty">Sin eventos para ' + titulo +
      (calEstadoFiltro!=='all' ? ' (con el filtro de estado activo)' : '') + '.</div>';
    return;
  }
  eventos.sort(function(a,b){ return (a.fechaInicio||0) - (b.fechaInicio||0); });

  // 1. INICIA LA CUADRÍCULA DEL CALENDARIO
  var partes = ['<div class="cal-grid" style="--cal-days:' + dias.length + ';--cal-cw:' + colW + ';">'];

  // 2. HEADER DEL CALENDARIO (Fijo arriba / Solo debe haber UNO)
  partes.push('<div class="cal-grid-head"><div></div>');
  
  for (var h = 0; h < dias.length; h++) {
    var fd = dias[h], dowh = fd.getDay(), wkh = (dowh===0||dowh===6);
    var colId = 'col-dia-' + fd.getTime();
    var lbl = '';
    
    if (calVista === 'semana') {
      var dStr = String(fd.getDate()).padStart(2,'0');
      var mStr = String(fd.getMonth()+1).padStart(2,'0');
      lbl = '<div style="font-size:9px; color:var(--muted); line-height:1.2; pointer-events:none;">' + diasSemAbr[dowh] + '</div>' +
            '<div style="font-weight:bold; font-size:11px; line-height:1.2; pointer-events:none;">' + dStr + '/' + mStr + '</div>';
    } else {
      lbl = String(fd.getDate());
    }
    
    partes.push('<div class="cal-day-head ' + colId + (wkh?' cal-weekend':'') + '" onclick="resaltarGantt(\''+colId+'\')" style="cursor:pointer; transition:0.2s; display:flex; flex-direction:column; justify-content:center; align-items:center; padding: 2px 0;">' + lbl + '</div>');
  }
  partes.push('</div>'); // Cierra cal-grid-head

  // 3. FILAS DE EVENTOS
  for (var e = 0; e < eventos.length; e++) {
    var ev = eventos[e];
    var iniE = new Date(ev.fechaInicio); iniE.setHours(0,0,0,0);
    var finE = ev.fechaFin ? new Date(ev.fechaFin) : new Date(ev.fechaInicio); finE.setHours(0,0,0,0);
    var este = String(ev.estado || '').toLowerCase();
    var claseEstado;
    if (este.indexOf('entregado') !== -1) claseEstado = 'cal-bar-ent';
    else if (este.indexOf('curso') !== -1 || este.indexOf('proceso') !== -1) claseEstado = 'cal-bar-curso';
    else if (finE < hoy) claseEstado = 'cal-bar-venc';
    else claseEstado = 'cal-bar-prog';

    var clienteCorto = (ev.cliente || '—').toString().substring(0, 15);
    var titCorto = (ev.titulo || '').toString().substring(0, 18);
    var dur = ev.duracion ? ' · ' + ev.duracion + 'd' : '';
    var tooltip = (ev.cliente || '') + ' · ' + (ev.titulo || '') + dur + ' · ' +
                  (ev.estado || 'Pendiente') + ' · ' + (ev.responsable || 'Sin responsable');

    // Color de prioridad
    var coloresPrio = { "Emergente": "#f59e0b", "Alta": "#ef4444", "Media": "#3b82f6", "Baja": "#10b981" };
    var colorBorde = coloresPrio[ev.prioridad] || "transparent";

    partes.push('<div class="cal-grid-row" style="border-left: 3px solid ' + colorBorde + ';" title="' + tooltip.replace(/"/g,'&quot;') + '">');
    partes.push('<div class="cal-cli">' + escapeHtml(clienteCorto) + '<small>' + escapeHtml(titCorto) + '</small></div>');
    
    // Celdas de los días (dentro de cada fila)
    for (var c = 0; c < dias.length; c++) {
      var cd = dias[c], dowc = cd.getDay(), wkc = (dowc===0||dowc===6);
      var esHoy = cd.getTime() === hoy.getTime();
      var dentro = (cd >= iniE && cd <= finE);
      var colIdCell = 'col-dia-' + cd.getTime(); // Agregado el ID para resaltar
      var cls = 'cal-cell ' + colIdCell;
      if (wkc) cls += ' cal-weekend';
      if (esHoy) cls += ' cal-today';
      if (dentro) cls += ' ' + claseEstado;
      partes.push('<div class="' + cls + '"></div>');
    }
    partes.push('</div>'); // Cierra cal-grid-row
  }

  // 4. CIERRA LA CUADRÍCULA
  partes.push('</div>'); // Cierra cal-grid
  $('cal-body').innerHTML = partes.join('');
}


function setCronPeriodo(v) { cronPeriodo = v || 'semana'; pintarCron(); }

function pintarCron() {
  var q = ($('f-cliente').value || '').toLowerCase().trim();

  // FIX FASE 8.35: alcance por período (semana/mes), dinámico como tabla.
  // 'semana' = semana en curso (lunes-domingo) · 'mes' = mes en curso · 'all' = todo.
  // Los eventos SIN fecha que no están entregados se muestran siempre (tareas
  // activas sin programar no deben ocultarse por el filtro de período).
  // REEMPLAZAR POR:
  var pIni = null, pFin = null;
  if (cronPeriodo === 'semana') {
    pIni = _inicioSemana(new Date());
    pFin = new Date(pIni); pFin.setDate(pIni.getDate() + 6); pFin.setHours(23,59,59,999);
  } else if (cronPeriodo === 'mes') {
    var hy = new Date();
    pIni = new Date(hy.getFullYear(), hy.getMonth(), 1);
    pFin = new Date(hy.getFullYear(), hy.getMonth()+1, 0, 23,59,59,999);
  } else if (cronPeriodo === 'hoy') {  // NUEVA LÓGICA DE HOY
    pIni = new Date(); pIni.setHours(0,0,0,0);
    pFin = new Date(); pFin.setHours(23,59,59,999);
  }

  function enPeriodo(d) {
    if (!pIni) return true;                       // 'all'
    if (!d.fechaInicio) return String(d.estado).toLowerCase().indexOf('entregado')===-1; // sin fecha y activa
    var ini = new Date(d.fechaInicio);
    var fin = d.fechaFin ? new Date(d.fechaFin) : ini;
    return !(fin < pIni || ini > pFin);
  }

  var filtrados = estado.cronograma.filter(d => {
    var est = String(d.estado).toLowerCase(), entregado = est.indexOf('entregado')!==-1;
    if (q && String(d.cliente).toLowerCase().indexOf(q)===-1 && String(d.titulo).toLowerCase().indexOf(q)===-1) return false;
    if (!enPeriodo(d)) return false;
    switch (filtroActual) {
      case 'urgent': return !entregado && d.diasRestantes!==null && d.diasRestantes<=1;
      case 'upcoming': return !entregado && d.diasRestantes!==null && d.diasRestantes>0 && d.diasRestantes<=7;
      case 'pending': return !entregado;
      case 'sinfile': return !d.urlArchivo && !entregado;
      default: return true;
    }
  }).slice(0, 120);

  var etiqueta = cronPeriodo==='semana' ? 'esta semana' : (cronPeriodo==='mes' ? 'este mes' : 'todos');
  var sinR = filtrados.filter(function(d){ return !d.responsable && String(d.estado).toLowerCase().indexOf('entregado')===-1; }).length;
  var rc = $('cron-resumen'); if (rc) rc.innerText = filtrados.length + ' · ' + etiqueta + (sinR ? ' · ' + sinR + ' sin resp.' : '');
  if (filtrados.length === 0) { $('cron-body').innerHTML = '<div class="empty">Sin elementos para el filtro/período actual.</div>'; return; }
  $('cron-body').innerHTML = filtrados.map(filaCron).join('');
}

function filaCron(d) {
  var est = String(d.estado).toLowerCase();
  var entregado = est.indexOf('entregado')!==-1, enProceso = est.indexOf('proceso')!==-1;
  var fechaStr = '—';
  if (d.fechaInicio) { var dt=new Date(d.fechaInicio); fechaStr = String(dt.getDate()).padStart(2,'0')+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][dt.getMonth()]; }
  var cdClass='pill-muted', cdText='—';
  if (entregado){cdClass='pill-ok';cdText='✓ Entregado';}
  else if (enProceso){cdClass='pill-info';cdText='⏳ En proceso';}
  else if (d.diasRestantes!==null){
    if(d.diasRestantes<0){cdClass='pill-danger';cdText='V '+Math.abs(d.diasRestantes)+'d';}
    else if(d.diasRestantes===0){cdClass='pill-warn';cdText='HOY';}

  return '<div class="rw"><div style="color:var(--muted);font-size:11px;">'+fechaStr+'</div>'+
    '<div><div style="font-weight:500;">'+escapeHtml(d.cliente)+'</div><div style="color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.titulo)+'</div></div>'+
    '<div style="font-size:11px;color:#60a5fa;overflow:hidden;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(d.responsable?escapeHtml(d.responsable):'<i style="color:var(--muted)">—</i>')+'</div>'+apoyosHtml+'</div>'+
    '<div><span class="pill '+cdClass+'">'+cdText+'</span></div><div class="act-grp">'+actions+'</div></div>';
}

function pintarPan() {
  var datos = estado.panelUltimos;
  if (!datos || !datos.length) { $('pan-body').innerHTML = '<div class="empty">Sin datos.</div>'; return; }
  var enProcesoN = datos.filter(function(d){ return String(d.avance||'').toLowerCase().indexOf('proceso')!==-1; }).length;
  var rp = $('pan-resumen'); if (rp) rp.innerText = datos.length + ' recientes · ' + enProcesoN + ' en proceso';
  $('pan-body').innerHTML = datos.map(function(d, di){
    var av = String(d.avance||'').toLowerCase(), cls='pill-muted', txt=d.avance||'—';
    if (av.indexOf('entregado')!==-1) cls='pill-ok'; else if (av.indexOf('proceso')!==-1) cls='pill-warn';
    // FIX FASE 8.34: efectividad con color (verde ≥90%, ámbar ≥70%, rojo <70%)
    var efColor='var(--muted)', ef='—';
    if (d.efectividad) {
      var pe = Math.round(d.efectividad*100); ef = pe+'%';
      efColor = pe>=90 ? 'var(--ok,#22c55e)' : (pe>=70 ? 'var(--warn,#eab308)' : 'var(--danger,#ef4444)');
    }
    // FIX FASE 8.34: botón de acceso al archivo (Excel para quien pueda; WMS para todos)
    var acc = '';
    if (d.urlArchivo) {
      if (P.verArchivoHijo || P.abrirLibro) acc += '<button class="icon-btn" onclick="window.open(\''+d.urlArchivo+'\',\'_blank\')" title="Abrir archivo del inventario">📊</button>';
      var wu = (d.wmsUrl ? d.wmsUrl : window.location.href.split('?')[0]) + '?vista=wms&fileId=' + encodeURIComponent(d.fileId||'') + '&cliente=' + encodeURIComponent(d.cliente||'') + (P.iniciarFin||P.abrirLibro?'&modo=op':'&modo=auditor');
      acc += '<button class="icon-btn" onclick="window.open(\''+wu+'\',\'_blank\')" title="Abrir Terminal WMS">📦</button>';
    } else { acc = '<span style="color:var(--muted);font-size:10px;">—</span>'; }
    var resp = d.responsable ? escapeHtml(d.responsable) : '<i style="color:var(--muted)">—</i>';
    // FASE 8.59: apoyos del evento vinculado a este archivo (match por fileId)
    var apPan = '';
    if (d.fileId && estado.cronograma) {
      var evPan = estado.cronograma.find(function(e){ return e.fileId && e.fileId === d.fileId && e.apoyos && e.apoyos.length; });
      if (evPan) apPan = '<div style="font-size:9px;color:#2dd4bf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="Apoyo: '+escapeHtml(evPan.apoyos.join(', '))+'">👥 '+escapeHtml(evPan.apoyos.join(', '))+'</div>';
    }
    // FASE 8.60: columna AVANCE (carga operativa del archivo, en vivo vía batch)
    var avIni = (av.indexOf('entregado') !== -1) ? '<b style="color:#22c55e;">100%</b>'
              : (d.fileId ? '<span style="color:var(--muted);">…</span>' : '—');
    return '<div class="rw" style="grid-template-columns:1.3fr 1.1fr 60px 52px 86px 88px 52px;gap:6px;">'+
      '<div><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.cliente)+'</div></div>'+
      '<div style="font-size:11px;color:#60a5fa;overflow:hidden;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+resp+'</div>'+apPan+'</div>'+
      '<div>'+fmtNum(d.unidades)+'</div>'+
      '<div style="color:'+efColor+';font-weight:500;">'+ef+'</div>'+
      '<div id="pan-av-'+di+'" style="font-size:11px;">'+avIni+'</div>'+
      '<div><span class="pill '+cls+'">'+escapeHtml(txt)+'</span></div>'+
      '<div class="act-grp">'+acc+'</div></div>';
  }).join('');

  // FASE 8.60: avance EN VIVO de los archivos en curso (una llamada batch,
  // sin bloquear el render; token para descartar respuestas viejas).
  var fidsPan = [];
  datos.forEach(function(d){
    if (d.fileId && String(d.avance||'').toLowerCase().indexOf('entregado') === -1) fidsPan.push(d.fileId);
  });
  if (fidsPan.length) {
    var tokPan = Date.now(); _panTok = tokPan;
    google.script.run.withSuccessHandler(function(mapa){
      if (_panTok !== tokPan) return;
      mapa = mapa || {};
      datos.forEach(function(d, di){
        if (!d.fileId || !mapa[d.fileId] || mapa[d.fileId].avance == null) return;
        var cel = document.getElementById('pan-av-'+di);
        if (!cel) return;
        var pv = Math.max(0, Math.min(100, Math.round(mapa[d.fileId].avance)));
        cel.innerHTML = '<b style="color:'+(pv>=100?'#22c55e':'#60a5fa')+';">'+pv+'%</b>'+
          (mapa[d.fileId].texto ? ' <span style="color:var(--muted);font-size:9px;">'+escapeHtml(mapa[d.fileId].texto)+'</span>' : '');
      });
    }).withFailureHandler(function(){}).obtenerAvancesWMS(fidsPan);
  }
}

var _cargaArr = [];
function pintarCarga() {

  if (!_cargaArr.length) { $('carga-resp').innerHTML = '<div class="empty">Sin pendientes.</div>'; return; }
  // FIX FASE 8.34: cada operario es clickable → drilldown de sus tareas activas.
  $('carga-resp').innerHTML = _cargaArr.map(function(pair, i){
    return '<div class="resp-row" style="cursor:pointer;" title="Ver tareas activas de '+escapeHtml(pair[0])+'" onclick="verCargaOperario('+i+')">'+
      '<span>'+escapeHtml(pair[0])+'</span><b>'+pair[1]+' ›</b></div>';

/* FIX FASE 8.34: drilldown de carga por operario — el coordinador ve las tareas
   activas (no entregadas) del operario seleccionado, con estado y acceso. */
function verCargaOperario(i) {
  var nombre = (_cargaArr[i] || [])[0] || '';
  if (!nombre) return;
  var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  // FASE 8.59: incluye tareas como RESPONSABLE y como APOYO. Por defecto SOLO
  // "En proceso"; con el toggle se agregan las Pendientes; las entregadas NUNCA.
  var incluirPend = !!arguments[1];
  var nomUp = String(nombre).trim().toUpperCase();
  var tareas = (estado.cronograma || []).filter(function(d){
    var est = String(d.estado||'').toLowerCase();
    if (est.indexOf('entregado') !== -1) return false;
    var esResp = String(d.responsable||'').trim().toUpperCase() === nomUp;
    var esApoyo = (d.apoyos||[]).some(function(a){ return String(a).trim().toUpperCase() === nomUp; });
    if (!esResp && !esApoyo) return false;
    d._rolEnTarea = esResp ? 'RESPONSABLE' : 'APOYO';
    var enProc = est.indexOf('proceso') !== -1 || est.indexOf('curso') !== -1;
    return enProc || incluirPend;
  });
  tareas.sort(function(a,b){
    var ea = String(a.estado||'').toLowerCase(), eb = String(b.estado||'').toLowerCase();
    var pa = (ea.indexOf('proceso')!==-1 || ea.indexOf('curso')!==-1) ? 0 : 1;
    var pb = (eb.indexOf('proceso')!==-1 || eb.indexOf('curso')!==-1) ? 0 : 1;
    if (pa !== pb) return pa - pb;   // las EN PROCESO primero (dónde está AHORA)
    return (a.fechaInicio||0) - (b.fechaInicio||0);
  });

  // FIX FASE 8.36: barra de avance reutilizable (cronograma=gris/azul; en vivo=azul claro).
  function _avHTML(pct, live, texto) {
    pct = Math.max(0, Math.min(100, Math.round(pct||0)));
    var color = pct>=100 ? '#22c55e' : (live ? '#60a5fa' : '#7d8aa8');
    var lblColor = live ? '#93c5fd' : 'var(--muted)';
    return '<div style="font-size:10px;color:'+lblColor+';margin-bottom:2px;white-space:nowrap;">'+pct+'%'+(texto?' · '+escapeHtml(texto):'')+'</div>'+
      '<div style="height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">'+
        '<div style="height:100%;width:'+pct+'%;background:'+color+';"></div></div>';
  }

  var _tok = Date.now(); _cargaTok = _tok;   // evita actualizar un modal posterior
  var filas = tareas.map(function(d, ti){
    var est = String(d.estado||'').toLowerCase();
    var enProc = est.indexOf('proceso')!==-1 || est.indexOf('curso')!==-1;
    var pill='pill-muted', ptxt='Programado';
    if (enProc){ pill='pill-info'; ptxt='En proceso'; }
    else if (d.diasRestantes!==null && d.diasRestantes<0){ pill='pill-danger'; ptxt='Vencido '+Math.abs(d.diasRestantes)+'d'; }
    else if (d.diasRestantes===0){ pill='pill-warn'; ptxt='Hoy'; }
    else if (d.diasRestantes!==null && d.diasRestantes<=7){ pill='pill-info'; ptxt='En '+d.diasRestantes+'d'; }
    var fStr='—'; if (d.fechaInicio){ var dt=new Date(d.fechaInicio); fStr=String(dt.getDate()).padStart(2,'0')+' '+meses[dt.getMonth()]; }
    var cat = d.categoria ? '<div style="color:var(--muted);font-size:10px;">'+escapeHtml(d.categoria)+'</div>' : '';
    // % del cronograma como valor inicial (instantáneo); luego se refresca con el WMS.
    // FASE 8.60: sin archivo → mostrar DESDE CUÁNDO está en la actividad
    // (apoyo: fecha/hora de registro en EQUIPOS_TAREA; responsable: fecha inicio).
    var avCell;
    if (d.urlArchivo) {
      avCell = '<div id="cav-'+ti+'">'+ _avHTML((Number(d.pct)||0)*100, false, '') +'</div>';
    } else {
      var desdeTxt = 'sin archivo';
      if (d._rolEnTarea === 'APOYO' && d.apoyosDesde && d.apoyosDesde[nomUp]) {
        var dd = new Date(d.apoyosDesde[nomUp]);
        desdeTxt = 'apoyo desde ' + String(dd.getDate()).padStart(2,'0') + ' ' + meses[dd.getMonth()] +
                   ' ' + String(dd.getHours()).padStart(2,'0') + ':' + String(dd.getMinutes()).padStart(2,'0');
      } else if (d.fechaInicio) {
        var di = new Date(d.fechaInicio);
        desdeTxt = 'en actividad desde ' + String(di.getDate()).padStart(2,'0') + ' ' + meses[di.getMonth()];
      }
      avCell = '<div style="font-size:10px;color:#fbbf24;white-space:nowrap;">🕒 '+desdeTxt+'</div>';
    }
    // REEMPLAZAR POR:
    var acc='';
    if (d.urlArchivo){
      var wu=(d.wmsUrl?d.wmsUrl:window.location.href.split('?')[0])+'?vista=wms&fileId='+encodeURIComponent(d.fileId||'')+'&cliente='+encodeURIComponent(d.cliente||'')+(P.iniciarFin||P.abrirLibro?'&modo=op':'&modo=auditor');
      if (P.abrirLibro) acc+='<button class="icon-btn" onclick="window.open(\''+d.urlArchivo+'\',\'_blank\')" title="Abrir Excel">📊</button>';
      acc+='<button class="icon-btn" onclick="window.open(\''+wu+'\',\'_blank\')" title="Conectar WMS">📦</button>';
    } else {
      var alerta = "alert('❌ Operación denegada.\\nEste evento aún no tiene un archivo de trabajo asignado en el cronograma.');";
      if (P.abrirLibro) acc+='<button class="icon-btn" onclick="'+alerta+'" title="Excel (Sin archivo asignado)">📊</button>';
      acc+='<button class="icon-btn" onclick="'+alerta+'" title="WMS (Sin archivo asignado)">📦</button>';
    }
    // FASE 8.62 (R3): pausar/reanudar SOLO el responsable de la tarea (o Admin).
    // El botón se muestra únicamente cuando el operario visto es el responsable
    // de ESE evento y coincide con el usuario actual (o es Admin).
    var soyAdmin = !!(P && P.admin);
    var puedeControlar = (d._rolEnTarea === 'RESPONSABLE' &&
                          (nomUp === String((U && U.nombre) || '').trim().toUpperCase())) || soyAdmin;
    if (puedeControlar) {
      if (enProc) acc = '<button class="mini-btn" title="Pausar (vuelve a Pendiente)" onclick="cargaAccion(\'pausar\','+d.fila+','+i+','+(incluirPend?'true':'false')+')">⏸</button>' + acc;
      else acc = '<button class="mini-btn start" title="Reanudar (pasa a En Proceso)" onclick="cargaAccion(\'reanudar\','+d.fila+','+i+','+(incluirPend?'true':'false')+')">▶</button>' + acc;
    }
    // FASE 8.61: TARJETA por tarea (legible y móvil) — reemplaza la grilla
    // apretada que encimaba avance/estado. Responsable = AZUL · Apoyo = TURQUESA.
    var rolBadge = d._rolEnTarea === 'APOYO'
      ? ' <span style="font-size:8px;background:rgba(45,212,191,0.15);color:#2dd4bf;padding:1px 6px;border-radius:8px;vertical-align:middle;">APOYO</span>'
      : ' <span style="font-size:8px;background:rgba(96,165,250,0.15);color:#60a5fa;padding:1px 6px;border-radius:8px;vertical-align:middle;">RESPONSABLE</span>';
    return '<div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;'+
        (enProc ? 'border-left:3px solid #60a5fa;background:rgba(96,165,250,0.06);' : '')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">'+
        '<div style="min-width:0;flex:1;"><span style="font-weight:600;font-size:12px;">'+escapeHtml(d.cliente||'—')+'</span>'+rolBadge+
          ' <span style="color:var(--muted);font-size:10px;">· '+fStr+'</span></div>'+
        '<span class="pill '+pill+'" style="flex-shrink:0;">'+ptxt+'</span>'+
      '</div>'+
      '<div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0 6px;">'+
        escapeHtml(d.titulo||'')+(d.categoria ? ' · '+escapeHtml(d.categoria) : '')+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">'+
        '<div style="flex:1;min-width:150px;">'+avCell+'</div>'+
        '<div class="act-grp" style="flex-shrink:0;">'+(acc||'')+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  // FASE 8.59: toggle para ver también los pendientes (los finalizados NUNCA)
  var toggleHtml = '<label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:6px;cursor:pointer;">'+
    '<input type="checkbox" '+(incluirPend?'checked':'')+' onchange="verCargaOperario('+i+', this.checked)"> Mostrar también pendientes</label>';
  var cuerpo = toggleHtml + (tareas.length
    ? '<div class="scroll" style="max-height:55vh;">'+filas+'</div>'
    : '<div class="empty">Sin tareas EN PROCESO para este operario. Activa "Mostrar también pendientes" para ver lo programado.</div>');
  modalCustom('👤 '+nombre+' · '+tareas.length+(incluirPend?' tarea(s) activa(s)':' en proceso'), '', cuerpo, 'Cerrar', cerrarModal);
  // Ocultar botón cancelar solo para este modal (ya que el de confirmación dice "Cerrar")
  var btnCancelar = document.querySelector('#modal .actions button:first-child');
  if (btnCancelar) btnCancelar.style.display = 'none';
  
  // Restaurar el botón cuando se cierre
  var oldClose = _modalCb;
  _modalCb = function() {
    if (btnCancelar) btnCancelar.style.display = 'inline-block';
    if (oldClose) oldClose();
  };

  // FIX FASE 8.36: refrescar con el AVANCE EN VIVO del WMS (una sola llamada batch,
  // sin bloquear: el modal ya se mostró con el % del cronograma).
  var fids = [];
  tareas.forEach(function(d){ if (d.fileId) fids.push(d.fileId); });
  if (fids.length) {
    google.script.run.withSuccessHandler(function(mapa){
      if (_cargaTok !== _tok) return;     // se abrió otro drilldown; descartar
      mapa = mapa || {};
      tareas.forEach(function(d, ti){
        if (!d.fileId) return;
        var info = mapa[d.fileId];
        if (!info || info.avance == null) return;
        var cel = document.getElementById('cav-'+ti);
        if (cel) cel.innerHTML = _avHTML(info.avance, true, (info.texto||'') + ' refs');
      });
    }).withFailureHandler(function(){}).obtenerAvancesWMS(fids);
  }
}
var _cargaTok = 0;
var _panTok = 0;

/* FASE 8.63 (R4): eliminar evento (backend valida responsable/Admin). */
function eliminarEvt(fila) {
  var ev = (estado.cronograma || []).find(function(d){ return d.fila === fila; });
  var etiqueta = ev ? (ev.cliente + ' · ' + (ev.titulo||'')) : ('fila ' + fila);
  if (!confirm('¿Eliminar el evento?\n\n' + etiqueta + '\n\nSe borra la fila del cronograma (NO borra el archivo de Drive). Solo el responsable o un Admin pueden hacerlo.')) return;
  toast('Eliminando…');
  google.script.run.withSuccessHandler(function(r){
    toast('🗑 ' + (r && r.mensaje ? r.mensaje : 'Evento eliminado'),'success');
    cargarDashboard(true);
  }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); })
  .dash_eliminarEvento(fila);
}

/* ===== FASE 8.63 (R7): KPI clicable → modal con el detalle filtrable ===== */
function abrirKpiDetalle(tipo) {
  if (!estado || !estado.cronograma) { toast('Datos no cargados aún','info'); return; }
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var titulos = { venc:'⛔ Vencidos', hoy:'📅 Para hoy', prox7:'🗓 Próximos 7 días',
                  entreg:'✓ Entregados (año)', proceso:'⏳ En proceso',
                  clientes:'🏢 Clientes activos del mes' };
  function esEntregado(d){ return String(d.estado||'').toLowerCase().indexOf('entregado')!==-1; }
  function enProceso(d){ var e=String(d.estado||'').toLowerCase(); return e.indexOf('proceso')!==-1||e.indexOf('curso')!==-1; }

  // FASE 8.64 (R3): detalle de CLIENTES ACTIVOS del mes en curso, agrupado.
  if (tipo === 'clientes') {
    var mesAct = hoy.getMonth(), anioAct = hoy.getFullYear();
    var porCli = {};
    (estado.cronograma||[]).forEach(function(d){
      var enMes = false;
      if (d.fechaInicio) { var f0=new Date(d.fechaInicio); enMes = (f0.getMonth()===mesAct && f0.getFullYear()===anioAct); }
      if (!enMes && d.fechaEntrega) { var f1=new Date(d.fechaEntrega); enMes = (f1.getMonth()===mesAct && f1.getFullYear()===anioAct); }
      if (!enMes && enProceso(d)) enMes = true;   // en proceso cuenta como activo
      if (!enMes) return;
      var c = String(d.cliente||'—').toUpperCase();
      if (!porCli[c]) porCli[c] = { cliente:c, total:0, entregados:0, enProceso:0, pendientes:0 };
      porCli[c].total++;
      if (esEntregado(d)) porCli[c].entregados++;
      else if (enProceso(d)) porCli[c].enProceso++;
      else porCli[c].pendientes++;
    });
    var arrCli = Object.keys(porCli).map(function(k){ return porCli[k]; })
                  .sort(function(a,b){ return b.total-a.total; });
    var filasCli = arrCli.map(function(c){
      return '<div class="rw" style="grid-template-columns:minmax(0,1.6fr) 70px 90px 90px 90px;gap:8px;align-items:center;">'+
        '<div style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(c.cliente)+'</div>'+
        '<div><b>'+c.total+'</b> <span style="color:var(--muted);font-size:10px;">evt</span></div>'+
        '<div><span class="pill pill-ok">'+c.entregados+' entr.</span></div>'+
        '<div><span class="pill pill-info">'+c.enProceso+' proc.</span></div>'+
        '<div><span class="pill pill-muted">'+c.pendientes+' pend.</span></div></div>';
    }).join('');
    var hdrCli = '<div class="rw" style="grid-template-columns:minmax(0,1.6fr) 70px 90px 90px 90px;gap:8px;color:var(--muted);font-size:10px;border-bottom:1px solid var(--border);padding-bottom:4px;">'+
      '<div>Cliente</div><div>Eventos</div><div>Entregados</div><div>En proceso</div><div>Pendientes</div></div>';
    modalCustom(titulos.clientes + ' ('+arrCli.length+')', '',
      arrCli.length ? '<div class="tbl" style="font-size:12px;">'+hdrCli+'<div class="scroll" style="max-height:55vh;">'+filasCli+'</div></div>'
                    : '<div class="empty">Sin clientes con actividad este mes.</div>',
      'Cerrar', cerrarModal);
    var mi = document.getElementById('modal-inner'); if (mi) mi.classList.add('wide');  // R4
    return;
  }

  var lista = (estado.cronograma||[]).filter(function(d){
    var ent = esEntregado(d);
    var dr = d.diasRestantes;
    switch(tipo){
      case 'venc':   return !ent && dr!==null && dr<0;
      case 'hoy':    return !ent && dr===0;
      case 'prox7':  return !ent && dr!==null && dr>0 && dr<=7;
      case 'entreg': return ent;
      case 'proceso':return enProceso(d);
      default: return !ent;
    }
  });
  lista.sort(function(a,b){ return (a.diasRestantes||0)-(b.diasRestantes||0); });
  window._kpiLista = lista; window._kpiTipo = tipo;
  _pintarKpiModal(titulos[tipo] || 'Detalle', lista, tipo);
}

function _pintarKpiModal(titulo, lista, tipo) {
  var filtro = (document.getElementById('kpi-filtro') ? $('kpi-filtro').value : '').toLowerCase().trim();
  var rows = lista.filter(function(d){
    if (!filtro) return true;
    return (String(d.cliente||'')+' '+String(d.titulo||'')+' '+String(d.responsable||'')).toLowerCase().indexOf(filtro)!==-1;
  });
  var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var cuerpo = rows.map(function(d){
    var fStr='—'; if(d.fechaInicio){var dt=new Date(d.fechaInicio);fStr=String(dt.getDate()).padStart(2,'0')+' '+meses[dt.getMonth()];}
    var est=String(d.estado||'').toLowerCase();
    var pill = est.indexOf('entregado')!==-1?'pill-ok':(est.indexOf('proceso')!==-1||est.indexOf('curso')!==-1?'pill-info':(d.diasRestantes!==null&&d.diasRestantes<0?'pill-danger':'pill-muted'));
    var estTxt = d.estado || (d.diasRestantes!==null && d.diasRestantes<0 ? 'Vencido '+Math.abs(d.diasRestantes)+'d' : 'Pendiente');
    var apoyos = (d.apoyos&&d.apoyos.length)?'<div style="font-size:9px;color:#2dd4bf;">👥 '+escapeHtml(d.apoyos.join(', '))+'</div>':'';
    var acc='';
    if (!esKpiEntregado(d) && P.iniciarFin) {
      acc += enProc2(d) ? '<button class="mini-btn end" onclick="finalizarEvt('+d.fila+')">✓ Fin</button>'
                        : '<button class="mini-btn start" onclick="iniciarEvt('+d.fila+')">▶ Iniciar</button>';
    }
    if (d.urlArchivo) acc += '<button class="icon-btn" onclick="window.open(\''+d.urlArchivo+'\',\'_blank\')" title="Abrir archivo">↗</button>';
    // FASE 8.64 (R4): minmax(0,…) evita que el texto se sobreponga a los pills;
    // cada celda controla su desborde con ellipsis.
    return '<div class="rw" style="grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.1fr) 104px auto;gap:8px;align-items:center;">'+
      '<div style="color:var(--muted);font-size:11px;">'+fStr+'</div>'+
      '<div style="min-width:0;"><div style="font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.cliente||'—')+'</div>'+
        '<div style="color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.titulo||'')+'</div></div>'+
      '<div style="min-width:0;font-size:11px;color:#60a5fa;"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.responsable||'—')+'</div>'+apoyos+'</div>'+
      '<div><span class="pill '+pill+'" style="white-space:nowrap;">'+escapeHtml(estTxt)+'</span></div>'+
      '<div class="act-grp" style="flex-shrink:0;">'+acc+'</div></div>';
  }).join('');
  var body =
    '<div style="margin-bottom:8px;"><input type="text" id="kpi-filtro" placeholder="🔎 Filtrar por cliente, tarea o responsable…" '+
      'oninput="_pintarKpiModal(\''+titulo.replace(/'/g,"")+'\', window._kpiLista, window._kpiTipo)" '+
      'value="'+escapeHtml(filtro)+'" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel-2);color:var(--text);font-size:12px;"></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:4px;">'+rows.length+' de '+lista.length+' evento(s)</div>'+
    (rows.length ? '<div class="tbl" style="font-size:12px;"><div class="scroll" style="max-height:52vh;">'+cuerpo+'</div></div>'
                 : '<div class="empty">Sin eventos.</div>');
  // Reusa el modal genérico (si ya está abierto, solo refresca el cuerpo)
  if ($('modal').classList.contains('show') && document.getElementById('kpi-filtro')) {
    $('modal-body').innerHTML = body;
    var inp=document.getElementById('kpi-filtro'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);}
  } else {
    modalCustom(titulo, '', body, 'Cerrar', cerrarModal);
  }
  // FASE 8.64 (R4): modal ANCHO para que nada se sobreponga (se limpia al cerrar)
  var miK = document.getElementById('modal-inner');
  if (miK) miK.classList.add('wide');
}
function esKpiEntregado(d){ return String(d.estado||'').toLowerCase().indexOf('entregado')!==-1; }
function enProc2(d){ var e=String(d.estado||'').toLowerCase(); return e.indexOf('proceso')!==-1||e.indexOf('curso')!==-1; }

/* FASE 8.62 (R3): el responsable (o Coordinador/Admin) agrega/quita apoyos de un
   evento YA creado. Modal con el equipo; pre-marca los apoyos activos actuales. */
function gestionarApoyos(fila) {
  var ev = (estado.cronograma || []).find(function(d){ return d.fila === fila; });
  var equipoArr = (estado && estado.equipo) ? estado.equipo : [];
  var respUp = ev ? String(ev.responsable||'').trim().toUpperCase() : '';
  toast('Cargando equipo…');
  google.script.run.withSuccessHandler(function(eq){
    eq = (eq || []).filter(function(m){ return String(m.estado).toUpperCase() === 'ACTIVO' && String(m.rol).toUpperCase() === 'APOYO'; });
    var activos = {}; eq.forEach(function(m){ activos[String(m.nombre).trim().toUpperCase()] = true; });
    var lista = equipoArr.filter(function(n){ return String(n).trim().toUpperCase() !== respUp; });
    var chips = lista.length ? lista.map(function(n){
        var mk = activos[String(n).trim().toUpperCase()];
        return '<label style="display:flex;gap:6px;align-items:center;padding:5px 8px;font-size:12px;cursor:pointer;border:1px solid '+(mk?'#2dd4bf':'var(--border)')+';border-radius:6px;background:'+(mk?'rgba(45,212,191,0.12)':'transparent')+';">'+
          '<input type="checkbox" class="ga-apoyo" value="'+escapeHtml(n)+'" '+(mk?'checked':'')+' style="accent-color:#2dd4bf;"> '+escapeHtml(n)+'</label>';
      }).join('') : '<div style="color:var(--muted);font-size:11px;">Sin miembros disponibles.</div>';
    modalCustom('👥 Equipo de apoyo — '+(ev?escapeHtml(ev.cliente):'evento fila '+fila),
      'Responsable: <b style="color:#60a5fa;">'+escapeHtml(respUp||'—')+'</b>. Marca/desmarca los apoyos. Solo el responsable, un Coordinador o un Admin pueden guardar.',
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:220px;overflow-y:auto;">'+chips+'</div>',
      'Guardar apoyos', function(){
        var sel = [];
        document.querySelectorAll('.ga-apoyo:checked').forEach(function(c){ sel.push(c.value); });
        cerrarModal(); toast('Guardando apoyos…');
        google.script.run.withSuccessHandler(function(r){
          toast('✓ Apoyos: +'+r.agregados+' / -'+r.quitados+(r.reactivados?' / react '+r.reactivados:''),'success');
          cargarDashboard(true);
        }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); })
        .gestionarApoyosEvento(fila, sel);
      });
  }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); })
  .obtenerEquipoTarea(fila);
}

/* FASE 8.60: pausar/retomar desde el drilldown de carga — actualiza el estado
   local para re-render inmediato y refresca el dashboard en silencio. */
function cargaAccion(tipo, fila, idx, incluirPend) {
  toast(tipo === 'pausar' ? 'Pausando…' : 'Reanudando…');
  var runner = google.script.run.withSuccessHandler(function(){
    toast(tipo === 'pausar' ? '✓ Pausado (Pendiente)' : '✓ En Proceso','success');
    var ev = (estado.cronograma || []).find(function(d){ return d.fila === fila; });
    if (ev) ev.estado = (tipo === 'pausar') ? 'Pendiente' : 'En Proceso';
    verCargaOperario(idx, incluirPend);   // re-render inmediato del modal
    cargarDashboard(true);                // refresco silencioso del resto
  }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); });
  // FASE 8.62 (R3): reanudar usa dash_reanudarEvento (gate responsable/Admin)
  if (tipo === 'pausar') runner.dash_pausarEvento(fila);
  else runner.dash_reanudarEvento(fila);
}

function setF(el, f) {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  el.classList.add('active'); filtroActual = f; pintarCron();
}

/* FIX FASE 8.8: Iniciar evento con selección flexible: responsable, fecha, archivo.
   Sincroniza con CRONOGRAMA-2026: si ya está "En Proceso" muestra info y
   permite actualizar campos vacíos sin pisar lo existente. */
function iniciarEvt(fila) {
  var equipo = estado.equipo || [];
  var ev = estado.cronograma.find(d => d.fila === fila);
  var yaEnProceso = ev && String(ev.estado || '').toLowerCase().indexOf('proceso') !== -1;
  var hoy = new Date().toISOString().slice(0,10);

  // Listar TODOS los del equipo activo (Operarios, Líderes, Coordinadores)
  var opts = equipo.map(n => '<option value="'+n+'">'+n+'</option>').join('');
  var info = yaEnProceso ?
    '<div style="background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.3);color:#fde047;padding:8px;border-radius:5px;font-size:11px;margin-bottom:10px;">⚠ Este evento ya está <b>En Proceso</b>. Solo se actualizarán campos vacíos. Marca <b>"Sobrescribir"</b> para reemplazarlos.</div>' : '';

  // Cargar archivos del cliente (para opción de asignar archivo)
  toast('Cargando archivos del cliente…');
  google.script.run.withSuccessHandler(function(archivos) {
    abrirModalInicio(ev, fila, opts, info, yaEnProceso, hoy, archivos || []);
  }).withFailureHandler(function() {
    abrirModalInicio(ev, fila, opts, info, yaEnProceso, hoy, []);
  }).listarArchivosDelCliente(ev ? ev.cliente : '');
}

function abrirModalInicio(ev, fila, opts, info, yaEnProceso, hoy, archivos) {
  var filesHtml = archivos.length === 0
    ? '<div class="empty" style="padding:8px;font-size:11px;color:var(--muted);">Sin archivos del cliente en Drive.</div>'
    : archivos.map(f =>
        '<label style="display:flex;gap:8px;padding:6px;border-radius:4px;cursor:pointer;align-items:center;">' +
          '<input type="radio" name="m-file-ini" value="'+f.id+'|'+f.url+'|'+escapeHtml(f.name)+'">' +
          '<div><div style="font-size:11px;font-weight:500;">'+escapeHtml(f.name)+'</div>' +
          '<div style="font-size:10px;color:var(--muted);">'+new Date(f.modificado).toLocaleDateString('es-ES')+' · '+escapeHtml(f.carpeta)+'</div></div>' +
        '</label>'
      ).join('');

  modalCustom('▶ Iniciar evento — fila #'+fila,
    'Cliente: <b>' + escapeHtml(ev ? ev.cliente : '') + '</b>',
    info +
    '<div class="field"><label>👤 Responsable (operario / líder / coordinador) *</label>' +
      '<select id="m-ini-resp" style="width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;">' +
        '<option value="">— Seleccione —</option>'+opts+'</select></div>' +
    '<div class="field"><label>📅 Fecha de inicio</label>' +
      '<input type="date" id="m-ini-fecha" value="'+hoy+'" style="width:100%;"></div>' +
    (yaEnProceso ? '<div class="field" style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="m-ini-sobreesc"><label for="m-ini-sobreesc" style="margin:0;font-size:11px;">Sobrescribir responsable existente</label></div>' : '') +
    '<div class="field"><label>📎 ¿Asignar archivo existente al evento? <span style="font-size:10px;color:var(--muted);">(opcional)</span></label>' +
      '<div style="display:flex;gap:6px;margin-bottom:4px;">' +
        '<label style="flex:1;"><input type="radio" name="m-ini-adj" value="no" checked onchange="mIniToggleFiles()"> No asignar</label>' +
        '<label style="flex:1;"><input type="radio" name="m-ini-adj" value="si" onchange="mIniToggleFiles()"> Seleccionar archivo</label>' +
      '</div>' +
      '<div id="m-ini-files" style="display:none;max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;padding:4px;">' + filesHtml + '</div>' +
    '</div>',
    'Iniciar',
    function() {
      var resp = $('m-ini-resp').value;
      if (!resp) { toast('Selecciona un responsable','error'); return false; }
      var fechaIni = $('m-ini-fecha').value || null;
      var opciones = { responsable: resp, fechaInicio: fechaIni };
      var so = $('m-ini-sobreesc');
      if (so && so.checked) opciones.sobrescribirResponsable = true;
      var adj = document.querySelector('input[name="m-ini-adj"]:checked');
      if (adj && adj.value === 'si') {
        var fc = document.querySelector('input[name="m-file-ini"]:checked');
        if (!fc) { toast('Selecciona archivo o cambia a "No asignar"','error'); return false; }
        var p = fc.value.split('|');
        opciones.fileId = p[0]; opciones.fileUrl = p[1]; opciones.fileName = p.slice(2).join('|');
      }
      cerrarModal(); toast('Iniciando evento…');
      google.script.run
        .withSuccessHandler(function(r){
          var msg = r.yaEnProceso ? '✓ Actualizado (ya en Proceso)' : '✓ Iniciado';
          if (r.archivoAsignado) msg += ' · archivo asignado';
          toast(msg, 'success');
          cargarDashboard();
        })
        .withFailureHandler(e=>toast('Error: '+(e.message||e),'error'))
        .iniciarEventoConOpciones(fila, opciones);
    });
}

function mIniToggleFiles() {
  var v = document.querySelector('input[name="m-ini-adj"]:checked').value;
  $('m-ini-files').style.display = (v==='si') ? 'block' : 'none';
}

function finalizarEvt(fila) {
  var ev = estado.cronograma.find(d => d.fila === fila);
  if (!ev) return;
  toast('Buscando archivos…');
  google.script.run.withSuccessHandler(archivos => abrirModalFin(ev, archivos||[]))
    .withFailureHandler(()=>abrirModalFin(ev, [])).listarArchivosDelCliente(ev.cliente);
}

function abrirModalFin(ev, archivos) {
  var hoy = new Date().toISOString().slice(0,10);
  var ya = !!ev.urlArchivo;
  var filesHtml = ya ? '<div style="background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.3);color:#fde047;padding:8px;border-radius:5px;font-size:11px;margin-bottom:10px;">⚠ Ya tiene archivo en Q, no se reemplaza.</div>' : `
    <div class="field"><label>📎 ¿Adjuntar archivo a columna Q?</label>
      <div style="display:flex;gap:6px;"><label style="flex:1;"><input type="radio" name="m-adj" value="no" checked onchange="mToggleFiles()"> No</label>
      <label style="flex:1;"><input type="radio" name="m-adj" value="si" onchange="mToggleFiles()"> Seleccionar archivo</label></div></div>
    <div id="m-files" style="display:none;max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;padding:4px;margin-top:6px;">
      ${archivos.length===0 ? '<div class="empty">Sin archivos del cliente.</div>' : archivos.map(f=>'<label style="display:flex;gap:8px;padding:6px;border-radius:4px;cursor:pointer;"><input type="radio" name="m-file" value="'+f.id+'|'+f.url+'|'+escapeHtml(f.name)+'"><div><div style="font-size:11px;font-weight:500;">'+escapeHtml(f.name)+'</div><div style="font-size:10px;color:var(--muted);">'+new Date(f.modificado).toLocaleDateString('es-ES')+' · '+escapeHtml(f.carpeta)+'</div></div></label>').join('')}
    </div>`;
  modalCustom('✓ Finalizar — fila #'+ev.fila, 'Cliente: '+escapeHtml(ev.cliente),
    '<div class="field"><label>📅 Fecha de culminación</label><input type="date" id="m-fecha" value="'+hoy+'"></div>'+filesHtml+
    '<div id="m-equipo-box"></div>',
    'Confirmar entrega', function(){ return confirmarFin(ev.fila); });

  // FASE 8.58: cargar el equipo registrado de la tarea (si lo hay). El
  // responsable puede DESMARCAR a quienes no participaron → quedan EXCLUIDOS.
  google.script.run.withSuccessHandler(function(eq){
    eq = (eq || []).filter(function(m){ return String(m.estado).toUpperCase() !== 'EXCLUIDO'; });
    var box = document.getElementById('m-equipo-box');
    if (!box || !eq.length) return;
    box.innerHTML =
      '<div class="field"><label>👥 Equipo que participó <small style="color:var(--muted);">(desmarca a quien NO participó — quedará excluido del registro)</small></label>' +
      '<div style="max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;padding:4px;">' +
      eq.map(function(m){
        return '<label style="display:flex;gap:6px;align-items:center;padding:3px 4px;font-size:12px;cursor:pointer;">' +
          '<input type="checkbox" class="m-eq" value="' + m.filaHoja + '" checked> ' + escapeHtml(m.nombre) +
          ' <span style="color:var(--muted);font-size:10px;">(' + (String(m.rol).toUpperCase() === 'RESPONSABLE' ? 'responsable' : 'apoyo') + ')</span></label>';
      }).join('') +
      '</div></div>';
  }).withFailureHandler(function(){}).obtenerEquipoTarea(ev.fila);
}

function mToggleFiles() {
  var v = document.querySelector('input[name="m-adj"]:checked').value;
  $('m-files').style.display = (v==='si') ? 'block' : 'none';
}

function confirmarFin(fila) {
  var fecha = $('m-fecha').value;
  if (!fecha) { toast('Indica fecha','error'); return false; }
  var adj = document.querySelector('input[name="m-adj"]:checked');
  var opciones = { fechaCulminacion: fecha };
  if (adj && adj.value === 'si') {
    var fc = document.querySelector('input[name="m-file"]:checked');
    if (!fc) { toast('Selecciona archivo o cambia a No','error'); return false; }
    var p = fc.value.split('|'); opciones.fileId=p[0]; opciones.fileUrl=p[1]; opciones.fileName=p.slice(2).join('|');
  }
  // FASE 8.58: exclusiones de equipo = miembros DESMARCADOS en el modal
  var exclusiones = [];
  document.querySelectorAll('.m-eq').forEach(function(c){ if (!c.checked) exclusiones.push(c.value); });

  cerrarModal(); toast('Finalizando…');
  if (exclusiones.length) {
    google.script.run
      .withSuccessHandler(function(r){ if (r && r.excluidos) toast('👥 ' + r.excluidos + ' operario(s) excluidos del registro','info'); })
      .withFailureHandler(function(){})
      .actualizarEquipoTareaFinal(fila, exclusiones);
  }
  google.script.run.withSuccessHandler(r=>{toast('✓ Entregado'+(r.archivoAdjuntado?' · archivo en Q':''),'success');cargarDashboard();})
    .withFailureHandler(e=>toast('Error: '+e.message,'error')).finalizarEventoConOpciones(fila, opciones);
}

                for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);

    })

function zipSetFiltro(f) {
  window._zipFiltroEstado = f;
  ['todos','entregado','pendiente'].forEach(function(t){
    var btn = document.getElementById('zip-f-' + t);
    if (btn) btn.classList.toggle('zip-fbtn-active', t === f);
  });
  zipRenderTabla();
}

function zipOrdenar(col) {
  if (window._zipOrden.columna === col) window._zipOrden.desc = !window._zipOrden.desc;
  else { window._zipOrden.columna = col; window._zipOrden.desc = false; }
  zipRenderTabla();
}

function zipRenderTabla() {
  var lista = window._zipLista || [];
  var qCli = (document.getElementById('zip-q-cliente') || {}).value || '';
  var qNom = (document.getElementById('zip-q-nombre') || {}).value || '';
  qCli = qCli.toLowerCase(); qNom = qNom.toLowerCase();
  var filtroEstado = window._zipFiltroEstado || 'todos';

  // Filtrar
  var filtrados = lista.filter(function(it) {
    if (qCli && (it.cliente || '').toLowerCase().indexOf(qCli) === -1) return false;
    var nombreArch = '';
    try { nombreArch = (it.fileUrl || '').toLowerCase(); } catch(e){}
    if (qNom && nombreArch.indexOf(qNom) === -1 &&
        (it.cliente || '').toLowerCase().indexOf(qNom) === -1) return false;
    var est = String(it.estado || '').toLowerCase();
    if (filtroEstado === 'entregado' && est.indexOf('entregado') === -1) return false;
    if (filtroEstado === 'pendiente' && est.indexOf('entregado') !== -1) return false;
    return true;
  });

  // Ordenar
  var orden = window._zipOrden;
  filtrados.sort(function(a, b) {
    var va, vb;
    if (orden.columna === 'cliente') { va = (a.cliente||'').toLowerCase(); vb = (b.cliente||'').toLowerCase(); }
    else if (orden.columna === 'archivo') { va = (a.fileUrl||'').toLowerCase(); vb = (b.fileUrl||'').toLowerCase(); }
    else if (orden.columna === 'fecha') { va = a.fecha || 0; vb = b.fecha || 0; }
    else if (orden.columna === 'estado') { va = (a.estado||'').toLowerCase(); vb = (b.estado||'').toLowerCase(); }
    if (va < vb) return orden.desc ? 1 : -1;
    if (va > vb) return orden.desc ? -1 : 1;
    return 0;
  });

  // Actualizar flechas de ordenamiento
  document.querySelectorAll('.zip-sortable').forEach(function(th) {
    var spn = th.querySelector('.zip-sort-arrow');
    if (!spn) return;
    spn.innerText = (th.dataset.col === orden.columna) ? (orden.desc ? '▼' : '▲') : '';
  });

  // Render tabla
  var tbody = document.getElementById('zip-tbody');
  if (!tbody) return;
  tbody.innerHTML = filtrados.map(function(it) {
    var fechaStr = it.fecha ? new Date(it.fecha).toLocaleDateString('es-EC') : '—';
    var estadoClass = String(it.estado||'').toLowerCase().indexOf('entregado') !== -1 ? 'pill-ok' : 'pill-muted';
    // Extraer nombre de archivo de la URL si es posible
    var nombreArch = '—';
    try {
      var m = (it.fileUrl||'').match(/\/d\/([a-zA-Z0-9_-]+)/);
      nombreArch = it.cliente; // fallback
    } catch(e){}
    return '<tr style="border-bottom:1px solid #283352;">' +
      '<td style="padding:6px 8px;"><input type="checkbox" class="zip-chk" data-fileid="' + it.fileId + '" onchange="actualizarContadorZip()"></td>' +
      '<td style="padding:6px 8px;font-weight:500;">' + escapeHtml(it.cliente) + '</td>' +
      '<td style="padding:6px 8px;font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);">' + escapeHtml(it.fileId.substring(0,12)) + '...</td>' +
      '<td style="padding:6px 8px;color:var(--muted);font-size:11px;">' + fechaStr + '</td>' +
      '<td style="padding:6px 8px;"><span class="pill ' + estadoClass + '">' + escapeHtml(it.estado || '—') + '</span></td>' +
      '</tr>';
  }).join('');

  var visEl = document.getElementById('zip-visibles');
  if (visEl) visEl.innerText = filtrados.length;
  actualizarContadorZip();
}

function zipSelAll(estado) {
  document.querySelectorAll('.zip-chk').forEach(function(c){ c.checked = estado; });

function actualizarContadorZip() {

}

// FASE 8.65 (R4): jerarquía de roles en el cliente (refleja _nivelRol del servidor).
function _nivelRolJS(rol){ var r=String(rol||'').toLowerCase(); if(r==='admin')return 4; if(r==='coordinador')return 3; if(r==='líder de conteo'||r==='lider de conteo')return 2; if(r==='operario'||r==='auditor')return 1; return 0; }
function _rolesAsignablesJS(){
  var mi = (U.rol||'').toLowerCase()==='admin' ? 99 : _nivelRolJS(U.rol);
  return ['Admin','Coordinador','Líder de Conteo','Auditor','Operario'].filter(function(r){ return _nivelRolJS(r) < mi; });
}
function filaUsuario(u) {
  var rolCls = u.rol==='Admin'?'pill-danger':(u.rol==='Coordinador'?'pill-info':(u.rol==='Auditor'?'pill-muted':'pill-ok'));
  var estPill = u.activo ? '<span class="pill pill-ok">Activo</span>' : '<span class="pill pill-danger">Inactivo</span>';
  var wmsBadge = u.rolWms ? ' <span class="pill pill-muted" style="font-size:9px;">WMS:'+escapeHtml(u.rolWms)+'</span>' : '';
  // FASE 8.65 (R4): editar/desactivar SOLO Admin (los demás solo ven la lista).
  var acciones = P.editarUsuarios
    ? '<button class="mini-btn" onclick=\'editarUsuario('+JSON.stringify(u)+')\'>✎</button>'+
      (u.activo?'<button class="mini-btn" onclick="desactUsuario('+u.fila+')">⊘</button>':'')
    : '<span style="color:var(--muted);font-size:10px;">solo Admin</span>';
  return '<div class="rw"><div><div style="font-weight:500;">'+escapeHtml(u.nombre)+'</div><div style="font-size:10px;color:var(--muted);">'+escapeHtml(u.email)+'</div></div>'+
    '<div><span class="pill '+rolCls+'">'+escapeHtml(u.rol)+'</span>'+wmsBadge+'</div><div style="font-size:11px;">'+escapeHtml(u.telefono||'—')+'</div>'+
    '<div>'+estPill+'</div><div class="act-grp">'+acciones+'</div></div>';
}
function abrirNuevoUsuario() {

/* ===== ANALYTICS ===== */
function cargarAnalytics() {
  // FASE 8.65 (estabilidad): solo mostrar "Cargando…" si está vacío; en los
  // auto-refresh se reescribe en su lugar SIN parpadear ni desaparecer.
  var ab = $('analytics-body');
  if (ab && (!ab.querySelector('.rw'))) ab.innerHTML = '<div class="empty">Cargando…</div>';
  google.script.run.withSuccessHandler(res => {
    if (!res.porUsuario.length) { $('analytics-body').innerHTML = '<div class="empty">Sin actividad registrada aún.</div>'; return; }
    // FASE 8.58: NOMBRE visible (email debajo, pequeño) + apoyos + exclusiones
    $('analytics-body').innerHTML = res.porUsuario.map(u => {
      var nom = u.nombre ? escapeHtml(u.nombre) : escapeHtml(u.email || '—');
      var sub = (u.nombre && u.email) ? '<div style="font-size:9px;color:var(--muted);">'+escapeHtml(u.email)+'</div>' : '';
      var ap  = (u.apoyos || 0), ex = (u.exclusiones || 0);
      // FASE 8.65 (R6): cada valor es CLICABLE → detalle de eventos/archivos.
      var em = escapeHtml(u.email||'');
      function cel(val, tipo, color){
        if (!val) return '<div style="color:var(--muted);">0</div>';
        return '<div style="color:'+color+';cursor:pointer;text-decoration:underline dotted;" title="Ver detalle" '+
               'onclick="verDetalleAnalytics(\''+em+'\',\''+tipo+'\',\''+escapeHtml((u.nombre||u.email||'').replace(/\x27/g,""))+'\')">'+val+'</div>';
      }
      return '<div class="rw" style="grid-template-columns:2fr repeat(6,minmax(52px,1fr));">'+
        '<div><div style="font-weight:500;font-size:11px;">'+nom+'</div>'+sub+'</div>'+
        cel(u.iniciados,'iniciados','var(--accent)')+cel(u.finalizados,'finalizados','var(--ok)')+
        cel(u.creados,'creados','var(--info)')+
        cel(ap,'apoyos','#2dd4bf')+
        cel(ex,'excluidos',(ex>0?'var(--danger)':'var(--muted)'))+
        '<div><b>'+u.total+'</b></div></div>';
    }).join('');
  }).withFailureHandler(e=>$('analytics-body').innerHTML='<div class="empty">Error: '+e.message+'</div>').obtenerAnalyticsGlobal();
}

/* FASE 8.65 (R6): drilldown de una métrica de un operario → eventos/archivos. */
function verDetalleAnalytics(email, tipo, nombre) {
  var titulos={iniciados:'▶ Iniciados',finalizados:'✓ Finalizados',creados:'📦 Archivos creados',apoyos:'👥 Apoyos',excluidos:'⚠ Exclusiones'};

  google.script.run.withSuccessHandler(function(lista){
    lista = lista||[];
    var body;
    if (!lista.length) body='<div class="empty">Sin registros.</div>';
    else if (tipo==='apoyos'||tipo==='excluidos'){
      body='<div class="tbl" style="font-size:12px;"><div class="rw" style="grid-template-columns:1.4fr 1fr 90px 84px;gap:8px;color:var(--muted);font-size:10px;border-bottom:1px solid var(--border);padding-bottom:4px;"><div>Cliente / Tarea</div><div>Estado</div><div>Duración</div><div>Fin</div></div>'+
        '<div class="scroll" style="max-height:52vh;">'+lista.map(function(r){
          var dur = r.minutos!=null ? (r.minutos>=60?(Math.floor(r.minutos/60)+'h '+(r.minutos%60)+'m'):(r.minutos+'m')) : '—';
          var fin = r.fin ? new Date(r.fin).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : (r.estado==='ACTIVO'?'en curso':'—');
          return '<div class="rw" style="grid-template-columns:1.4fr 1fr 90px 84px;gap:8px;align-items:center;">'+
            '<div style="min-width:0;"><div style="font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(r.cliente||'—')+'</div><div style="color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(r.titulo||'')+'</div></div>'+
            '<div><span class="pill '+(r.estado==='EXCLUIDO'?'pill-danger':(r.estado==='ACTIVO'?'pill-info':'pill-muted'))+'">'+escapeHtml(r.estado||'')+'</span></div>'+
            '<div style="font-size:11px;">'+dur+'</div><div style="font-size:11px;color:var(--muted);">'+fin+'</div></div>';
        }).join('')+'</div></div>';
    } else {
      body='<div class="tbl" style="font-size:12px;"><div class="scroll" style="max-height:52vh;">'+lista.map(function(r){
        var f = r.fecha ? new Date(r.fecha).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
        return '<div class="rw" style="grid-template-columns:120px 1fr;gap:8px;"><div style="color:var(--muted);font-size:11px;">'+f+'</div><div style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(r.detalle||r.accion||'')+'</div></div>';
      }).join('')+'</div></div>';
    }
