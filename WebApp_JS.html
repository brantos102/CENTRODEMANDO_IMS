    var mi=document.getElementById('modal-inner'); if(mi) mi.classList.add('wide');
  }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); })
  .detalleAnalyticsUsuario(email, tipo);
}

/* ===== WIZARD / FORM EVENTO (overlays) ===== */
/* ===== FASE 8.59: RECORDATORIO DE TRABAJOS ACTIVOS ANTES DE CREAR =====
   Antes de crear un evento o archivo, se muestran los trabajos del usuario
   (responsable o apoyo) que siguen En Proceso o Pendientes, con acciones:
   ⏸ Dejar pendiente (pausa) · ▶ Retomar · ✓ Finalizar · o Continuar sin cambios. */
function _misTrabajosActivos() {
  var nomU = String((U && U.nombre) || '').trim().toUpperCase();
  if (!nomU || !estado || !estado.cronograma) return [];
  return estado.cronograma.filter(function(d){
    var est = String(d.estado || '').toLowerCase();
    if (est.indexOf('entregado') !== -1) return false;
    var esResp = String(d.responsable || '').trim().toUpperCase() === nomU;
    var esApoyo = (d.apoyos || []).some(function(a){ return String(a).trim().toUpperCase() === nomU; });
    if (!esResp && !esApoyo) return false;
    d._rolEnTarea = esResp ? 'RESPONSABLE' : 'APOYO';
    return true;
  });
}

function verificarTrabajosAntesDeCrear(continuar) {
  var evs = _misTrabajosActivos();
  if (!evs.length) { continuar(); return; }
  evs.sort(function(a,b){
    var pa = String(a.estado||'').toLowerCase().indexOf('proceso') !== -1 ? 0 : 1;
    var pb = String(b.estado||'').toLowerCase().indexOf('proceso') !== -1 ? 0 : 1;
    return pa - pb;
  });
  var filas = evs.slice(0, 10).map(function(d){
    var est = String(d.estado||'').toLowerCase();
    var enP = est.indexOf('proceso') !== -1 || est.indexOf('curso') !== -1;
    var pill = enP ? '<span class="pill pill-info">⏳ En proceso</span>' : '<span class="pill pill-muted">Pendiente</span>';
    var rolTxt = d._rolEnTarea === 'APOYO' ? ' <span style="color:#2dd4bf;font-size:9px;">(apoyo)</span>' : '';
    var accs = enP
      ? '<button class="mini-btn" onclick="accionTrabajo(\'pausar\','+d.fila+')">⏸ Dejar pendiente</button>'
      : '<button class="mini-btn start" onclick="accionTrabajo(\'retomar\','+d.fila+')">▶ Retomar</button>';
    accs += '<button class="mini-btn end" onclick="accionTrabajo(\'fin\','+d.fila+')">✓ Finalizar</button>';
    return '<div class="rw" id="trab-'+d.fila+'" style="grid-template-columns:1fr 92px auto;gap:6px;align-items:center;">'+
      '<div><div style="font-weight:500;font-size:12px;">'+escapeHtml(d.cliente||'—')+rolTxt+'</div>'+
      '<div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(d.titulo||'')+'</div></div>'+
      '<div>'+pill+'</div><div class="act-grp">'+accs+'</div></div>';
  }).join('');
  window._postTrabajosCb = continuar;
  modalCustom('📋 Tienes '+evs.length+' trabajo(s) activo(s)',
    'Decide qué hacer con tus trabajos actuales antes de crear uno nuevo, o continúa sin cambios:',
    '<div class="tbl" style="font-size:12px;"><div class="scroll" style="max-height:45vh;">'+filas+'</div></div>',
    'Continuar con la creación', function(){
      cerrarModal();
      var cb = window._postTrabajosCb; window._postTrabajosCb = null;
      if (cb) cb();
    });
}

function accionTrabajo(tipo, fila) {
  if (tipo === 'fin') {
    window._postTrabajosCb = null;
    cerrarModal();
    finalizarEvt(fila);   // flujo de finalización existente (incluye equipo)
    return;
  }
  var row = document.getElementById('trab-'+fila);
  toast(tipo === 'pausar' ? 'Pausando…' : 'Retomando…');
  var runner = google.script.run.withSuccessHandler(function(){
    toast(tipo === 'pausar' ? '✓ Quedó Pendiente (pausado)' : '✓ Quedó En Proceso','success');
    if (row) {
      var pillCell = row.children[1], accCell = row.children[2];
      if (pillCell) pillCell.innerHTML = (tipo === 'pausar')
        ? '<span class="pill pill-muted">Pendiente</span>'
        : '<span class="pill pill-info">⏳ En proceso</span>';
      if (accCell) accCell.innerHTML = '<span style="color:var(--ok);font-size:10px;">✓ actualizado</span>';
    }
    cargarDashboard();
  }).withFailureHandler(function(e){ toast('Error: '+(e.message||e),'error'); });
  if (tipo === 'pausar') runner.dash_pausarEvento(fila);
  else runner.dash_reanudarEvento(fila);   // FASE 8.62 (R3)
}

/* FASE 8.60: resaltar chip de apoyo al marcar + resumen en vivo */
function feApoyoToggle(chk) {
  var lbl = chk.closest('label');
  if (lbl) {
    lbl.style.background = chk.checked ? 'rgba(45,212,191,0.15)' : '';
    lbl.style.borderColor = chk.checked ? '#2dd4bf' : 'var(--border)';
  }
  var sel = [];
  document.querySelectorAll('.fe-apoyo:checked').forEach(function(c){ sel.push(c.value); });
  var box = document.getElementById('fe-apoyos-sel');
  if (box) box.innerHTML = sel.length
    ? '✓ <b>'+sel.length+'</b> apoyo(s): '+sel.map(escapeHtml).join(', ')
    : 'Sin apoyos seleccionados.';
}

/* FASE 8.65: el equipo de apoyo NO debe mostrar al responsable (evita confusión).
   Se re-aplica al cambiar el responsable en el selector. */
function _feFiltrarApoyos() {
  var resp = String(($('fe-resp') && $('fe-resp').value) || '').trim().toUpperCase();
  document.querySelectorAll('.fe-apoyo').forEach(function(c){
    var lbl = c.closest('label');
    var esResp = String(c.value || '').trim().toUpperCase() === resp && resp !== '';
    if (lbl) lbl.style.display = esResp ? 'none' : 'flex';
    if (esResp && c.checked) { c.checked = false; feApoyoToggle(c); }
  });
}

function abrirWizard(skipCheck) {
  if (!P.crearInventario) return toast('Tu rol no permite crear inventarios','error');
  // FASE 8.59: recordatorio de trabajos activos antes de crear
  if (!skipCheck && _misTrabajosActivos().length) {
    verificarTrabajosAntesDeCrear(function(){ abrirWizard(true); });
    return;
  }
  // HOTFIX 8.66.6: Google BLOQUEA embeber una web app de Apps Script en un
  // iframe dentro de otra (por eso el modal-iframe daba "rechazó la conexión"
  // pero la pestaña SÍ carga). Solución que funciona y se siente como modal:
  // VENTANA FLOTANTE centrada sobre el panel (oscurecido). No es iframe → no hay
  // bloqueo; no es pestaña de fondo → se ve encima del panel.
  _abrirWizardVentana();
}

/* HOTFIX 8.66.6: abre el asistente en una ventana emergente centrada + oscurece
   el panel; al cerrarla, refresca el dashboard. Confiable (sin iframe). */
function _abrirWizardVentana() {
  var base = window.__WEBAPP_URL__ || window.location.href.split('?')[0].split('#')[0];
  var url = base + (base.indexOf('?') === -1 ? '?' : '&') + 'vista=wizard';
  var w = Math.min(1150, (screen.availWidth || 1200) - 40);
  var h = Math.min(860, (screen.availHeight || 800) - 60);
  var left = Math.max(0, ((screen.availWidth || 1200) - w) / 2);
  var top = Math.max(0, ((screen.availHeight || 800) - h) / 2);
  // popup=yes fuerza VENTANA EMERGENTE (no pestaña) — clave cuando el Centro de
  // Mando corre como app instalada (PWA) en el escritorio.
  var win = window.open(url, 'ims_wizard',
    'popup=yes,width='+w+',height='+h+',left='+left+',top='+top+',resizable=yes,scrollbars=yes');
  if (!win) {
    // Popups bloqueados → modal con enlace directo.
    modalCustom('📦 Asistente de Creación', 'Tu navegador bloqueó la ventana. Ábrelo con este botón (permite ventanas emergentes para no repetirlo):',
      '<div style="text-align:center;padding:8px 0;"><a href="'+url+'" target="_blank" onclick="cerrarModal();_mostrarOverlayWizard(null);" style="background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;display:inline-block;">▶ Abrir Asistente de Creación</a></div>',
      'Cerrar', cerrarModal);
    return;
  }
  try { win.focus(); } catch(e){}
  _mostrarOverlayWizard(win);
}

/* Oscurece el panel mientras el asistente está abierto; al cerrarse, refresca. */
function _mostrarOverlayWizard(win) {
  var ov = document.getElementById('wizard-overlay-dim');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'wizard-overlay-dim';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99990;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);';
    ov.innerHTML =
      '<div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px 28px;text-align:center;max-width:420px;color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,0.5);">'+
        '<div style="font-size:34px;margin-bottom:8px;">📦</div>'+
        '<div style="font-size:15px;font-weight:600;margin-bottom:6px;">Asistente de Creación abierto</div>'+
        '<div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Se abrió en una ventana flotante. Crea el archivo ahí; al cerrarla, este panel se actualizará solo.</div>'+
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">'+
          '<button onclick="_focoWizard()" style="background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Traer la ventana al frente</button>'+
          '<button onclick="_cerrarOverlayWizard(true)" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:12px;cursor:pointer;">Ya terminé</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(ov);
  }
  ov.style.display = 'flex';
  window._wizWin = win || null;
  // Poll: si la ventana se cierra, quitar overlay y refrescar.
  if (window._wizPoll) clearInterval(window._wizPoll);
  if (win) {
    window._wizPoll = setInterval(function(){
      try { if (win.closed) { _cerrarOverlayWizard(true); } } catch(e){}
    }, 1000);
  }
}
function _focoWizard(){ try { if (window._wizWin && !window._wizWin.closed) window._wizWin.focus(); } catch(e){} }
function _cerrarOverlayWizard(refrescar) {
  if (window._wizPoll) { clearInterval(window._wizPoll); window._wizPoll = null; }
  var ov = document.getElementById('wizard-overlay-dim');
  if (ov) ov.style.display = 'none';
  try { if (window._wizWin && !window._wizWin.closed) window._wizWin.close(); } catch(e){}
  window._wizWin = null;
  if (refrescar) { try { cargarDashboard(true); } catch(e){} toast('✓ Panel actualizado','success'); }
}

function cerrarWizardModal() {
  var m = document.getElementById('wizard-modal-overlay');
  if (m) m.remove();
  // FIX FASE 8.7: Recargar el dashboard para reflejar el nuevo archivo
  // creado (cronograma, KPIs, cargas por operario, etc.)
  try { cargarDashboard(); } catch(e) {}
  toast('Panel actualizado','success');
}

// FIX FASE 8.2/8.7: Escuchar mensajes del iframe del wizard
// - CERRAR_WIZARD / cerrarWizard → cierra el modal
// - inventarioCreado → recarga el dashboard sin perder selección
window.addEventListener('message', function(ev) {
  if (!ev || !ev.data) return;
  var tipo = ev.data.tipo;
  if (tipo === 'CERRAR_WIZARD' || tipo === 'cerrarWizard') {
    cerrarWizardModal();
  } else if (tipo === 'inventarioCreado') {
    // HOTFIX 8.66.7: quitar el overlay de la ventana flotante + refrescar.
    try { _cerrarOverlayWizard(false); } catch(e){}
    setTimeout(function(){ try { cerrarWizardModal(); } catch(e){} }, 200); // legacy iframe
    setTimeout(function(){
      cargarDashboard(false);
      toast('✓ Panel actualizado con el nuevo archivo','success');
    }, 400);
  }
});

/* FIX FASE 8.10: Crear evento sin dependencias entre campos.
   - Cliente con autocomplete (datalist) — permite escribir libremente o elegir de la lista
   - Responsable dropdown con TODOS los miembros del equipo activo
   - Si el equipo no está cargado al abrir, lo solicita en paralelo (fallback)
   - Todos los campos son independientes y se pueden llenar en cualquier orden */
function abrirFormEvento(skipCheck) {
  if (!P.crearInventario) return toast('Tu rol no permite crear eventos','error');
  // FASE 8.59: recordatorio de trabajos activos antes de crear
  if (!skipCheck && _misTrabajosActivos().length) {
    verificarTrabajosAntesDeCrear(function(){ abrirFormEvento(true); });
    return;
  }

  // Garantizar que equipo y clientes estén disponibles
  var equipoCargado = (estado && estado.equipo && estado.equipo.length > 0);
  var clientesCargados = (estado && estado.clientes && estado.clientes.length > 0);

  if (!equipoCargado || !clientesCargados) {
    toast('Cargando catálogos…','info');
    google.script.run
      .withSuccessHandler(function(d){
        if (d) {
          if (d.equipo) estado.equipo = d.equipo;
          if (d.clientes) estado.clientes = d.clientes;
        }
        _renderFormEvento();
      })
      .withFailureHandler(function(){ _renderFormEvento(); })
      .dash_obtenerDashboard();
    return;
  }
  _renderFormEvento();
}

function _renderFormEvento() {
  // Equipo: TODOS los miembros activos (Operarios/Líderes/Coordinadores)
  var equipoArr = (estado && estado.equipo) ? estado.equipo : [];
  // FASE 8.63 (R5): pre-seleccionar al usuario logeado como responsable.
  var _miNombreUp = String((U && U.nombre) || '').trim().toUpperCase();
  var roles = equipoArr.map(function(n){
    var sel = (String(n).trim().toUpperCase() === _miNombreUp) ? ' selected' : '';
    return '<option value="'+escapeHtml(n)+'"'+sel+'>'+escapeHtml(n)+'</option>';
  }).join('');

  // Clientes para datalist (autocomplete)
  var clientesArr = (estado && estado.clientes) ? estado.clientes : [];
  var clientesOpts = clientesArr.map(function(c){ return '<option value="'+escapeHtml(c)+'">'; }).join('');

  var hoy = new Date().toISOString().slice(0,10);

  // Aviso si el equipo está vacío (operativo, no bloqueante)
  var avisoVacio = (equipoArr.length === 0)
    ? '<div style="background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.3);color:#fde047;padding:7px;border-radius:5px;font-size:11px;margin-bottom:8px;">⚠ La lista de equipo está vacía. Agrega usuarios en la pestaña Usuarios o ejecuta "Sincronizar c/Panel" antes de continuar.</div>'
    : '';

  modalCustom('📅 Nuevo evento en cronograma',
    'Llena los campos en cualquier orden. Los datos NO dependen entre sí.',
    avisoVacio +
    '<datalist id="dl-clientes-evt">' + clientesOpts + '</datalist>' +
    '<div class="field"><label>Título *</label>' +
      '<input type="text" id="fe-titulo" placeholder="Ej. Inventario Cíclico - CLIENTE (Mayo - 2026)" autocomplete="off"></div>' +
    '<div class="field"><label>Cliente * <small style="color:var(--muted);">(escribe o elige de la lista)</small></label>' +
      '<input type="text" id="fe-cliente" list="dl-clientes-evt" placeholder="Ej. SAINT GOBAIN" autocomplete="off"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="field"><label>Responsable * <small style="color:var(--muted);">(' + equipoArr.length + ' disp.)</small></label>' +
        '<select id="fe-resp" onchange="_feFiltrarApoyos()"><option value="">— Seleccione —</option>' + roles + '</select></div>' +
      '<div class="field"><label>Prioridad</label>' +
        '<select id="fe-prio"><option>Alta</option><option selected>Media</option><option>Baja</option></select></div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="field"><label>Fecha inicio *</label>' +
        '<input type="date" id="fe-fini" value="'+hoy+'"></div>' +
      '<div class="field"><label>Frecuencia</label>' +
        '<select id="fe-frec"><option>MENSUAL</option><option>SEMANAL</option><option>QUINCENAL</option><option>BIMESTRAL</option><option>TRIMESTRAL</option><option>SEMESTRAL</option><option>ANUAL</option><option>EMERGENTE</option></select></div>' +
    '</div>' +
    // FIX FASE 8.55/8.59: categoría + fecha fin tentativa (si se deja vacía, el
    // servidor asigna inicio + 4 días — ventana estándar del cronograma)
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="field"><label>Fecha fin tentativa <small style="color:var(--muted);">(opcional — vacío = inicio + 1 día)</small></label>' +
        '<input type="date" id="fe-fent"></div>' +
      '<div class="field"><label>Categoría</label>' +
        '<select id="fe-cat"><option>Inventario Programado</option><option>Trabajo Slotting</option><option>Inventario No Programado</option></select></div>' +
    '</div>' +
    // FASE 8.58/8.60: equipo de apoyo — chips claros (resaltado al marcar) +
    // resumen EN VIVO de seleccionados para no perder de vista a quién se marcó.
    '<div class="field"><label>👥 Equipo de apoyo <small style="color:var(--muted);">(opcional — el responsable no necesita marcarse)</small></label>' +
      '<div style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;">' +
      (equipoArr.length
        ? equipoArr.map(function(n){
            return '<label style="display:flex;gap:6px;align-items:center;padding:5px 8px;font-size:12px;cursor:pointer;border:1px solid var(--border);border-radius:6px;transition:all .15s;">' +
              '<input type="checkbox" class="fe-apoyo" value="'+escapeHtml(n)+'" onchange="feApoyoToggle(this)" style="accent-color:#2dd4bf;"> '+escapeHtml(n)+'</label>';
          }).join('')
        : '<div style="color:var(--muted);font-size:11px;padding:4px;grid-column:1/-1;">Sin miembros disponibles.</div>') +
      '</div>' +
      '<div id="fe-apoyos-sel" style="font-size:11px;color:#2dd4bf;margin-top:4px;min-height:14px;">Sin apoyos seleccionados.</div></div>',
    'Crear evento', function(){
      var apoyosSel = [];
      document.querySelectorAll('.fe-apoyo:checked').forEach(function(c){ apoyosSel.push(c.value); });
      var respSel = ($('fe-resp').value || '').trim();
      var datos = {
        titulo:       ($('fe-titulo').value || '').trim(),
        cliente:      ($('fe-cliente').value || '').trim(),
        responsable:  respSel,
        prioridad:    $('fe-prio').value,
        fechaInicio:  $('fe-fini').value,
        frecuencia:   $('fe-frec').value,
        categoria:    $('fe-cat').value,   // FIX FASE 8.55
        fechaEntrega: $('fe-fent').value,  // FASE 8.59: fecha fin tentativa
        // FASE 8.58: apoyos sin duplicar al responsable
        apoyos:       apoyosSel.filter(function(a){ return a.toUpperCase() !== respSel.toUpperCase(); })
      };
      var faltantes = [];
      if (!datos.titulo) faltantes.push('Título');
      if (!datos.cliente) faltantes.push('Cliente');
      if (!datos.responsable) faltantes.push('Responsable');
      if (!datos.fechaInicio) faltantes.push('Fecha inicio');
      if (faltantes.length > 0) { toast('Falta: ' + faltantes.join(', '),'error'); return false; }

      // FASE 8.65 (R8): antes de crear, buscar eventos SIMILARES no entregados.
      toast('Verificando duplicados…','info');
      google.script.run.withSuccessHandler(function(similares){
        cerrarModal();
        if (similares && similares.length) _modalEventoSimilar(similares, datos);
        else _crearEventoFinal(datos);
      }).withFailureHandler(function(){ cerrarModal(); _crearEventoFinal(datos); })
      .buscarEventosSimilares(datos.cliente, datos.titulo);
      return false; // no cerrar aún; lo maneja el callback
    });
  // FASE 8.65 (C): ocultar del equipo de apoyo al responsable pre-seleccionado.
  setTimeout(_feFiltrarApoyos, 0);
}

        '<div class="field"><label>Contraseña API *</label><input type="password" id="ca-pass" autocomplete="new-password"></div>' +
      '</div>',
      'Guardar credencial', function(){
        var cli = $('ca-cliente').value.trim(), us = $('ca-user').value.trim(), pa = $('ca-pass').value;
        if (!cli || !us || !pa) { toast('Completa cliente, usuario y contraseña','error'); return false; }
        cerrarModal(); toast('Guardando credencial de ' + cli.toUpperCase() + '…');
        google.script.run.withSuccessHandler(function(){ toast('✓ Credencial guardada (token renovará con la clave nueva)','success'); })
          .withFailureHandler(function(e){ toast('Error: ' + (e.message || e),'error'); })
          .guardarCredencialAPI(cli, us, pa);
      });
  }).withFailureHandler(function(e){ toast('Error: ' + (e.message || e),'error'); })
  .listarClientesAPI();
}

function eliminarCredAPI(cliente) {
  if (!confirm('¿Eliminar la credencial API de ' + cliente + '?\nEse cliente dejará de poder extraer stock hasta registrar una nueva.')) return;
  toast('Eliminando…');
  google.script.run.withSuccessHandler(function(){ toast('✓ Credencial eliminada','success'); cerrarModal(); abrirCredencialesAPI(); })
    .withFailureHandler(function(e){ toast('Error: ' + (e.message || e),'error'); })
    .eliminarCredencialAPI(cliente);
}

function migrarCredAPI() {
  if (!confirm('¿Migrar las credenciales de la pestaña CREDENCIALES_API al almacenamiento interno y ELIMINAR la pestaña?\n\nDespués de esto las claves ya no estarán visibles en el libro.')) return;
  toast('Migrando…');
  google.script.run.withSuccessHandler(function(r){
      toast('✓ ' + (r && r.mensaje ? r.mensaje : 'Migración completa'),'success');
      cerrarModal(); abrirCredencialesAPI();
    })
    .withFailureHandler(function(e){ toast('Error: ' + (e.message || e),'error'); })
    .migrarCredencialesAScriptProperties();
}

/* ===== MODAL GENÉRICO ===== */
var _modalCb = null;
function modalCustom(titulo, msg, bodyHtml, okText, callback, danger) {
  $('modal-titulo').innerText = titulo;
  $('modal-msg').innerHTML = msg || '';
  $('modal-body').innerHTML = bodyHtml || '';
  $('modal-ok').innerText = okText || 'Confirmar';
  $('modal-ok').className = 'b confirm' + (danger ? ' danger' : '');
  _modalCb = callback;
  $('modal-ok').onclick = function(){ if (_modalCb) { var r = _modalCb(); /* si devuelve false no cierra */ } };
  // FASE 8.65 (D): si el botón principal ya es "Cerrar"/"Aceptar" (modal solo
  // informativo), ocultar el "Cancelar" para no duplicar la misma acción.
  var _bcanc = document.querySelector('#modal .actions button:first-child');
  if (_bcanc) {
    var soloInfo = /^(cerrar|aceptar|entendido|ok)$/i.test(String(okText || '').trim());
    _bcanc.style.display = soloInfo ? 'none' : 'inline-block';
  }
  $('modal').classList.add('show');
}
function cerrarModal(){
  $('modal').classList.remove('show'); _modalCb=null;
  // FIX FASE 8.54: si un modal ocultó su botón Cancelar (p.ej. carga por operario)
  // y se cerró con Escape/X, restaurarlo para el siguiente modal.
  var bcanc = document.querySelector('#modal .actions button:first-child');
  if (bcanc) bcanc.style.display = 'inline-block';
  // FASE 8.64 (R4): limpiar el modo ANCHO del modal (lo usan los KPIs)
  var miC = document.getElementById('modal-inner');
  if (miC) miC.classList.remove('wide');
}

function toast(msg, type) {
  var t = $('toast'); t.innerText = msg; t.className = type||''; t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 3500);
}

/* ===== ENTER / ESC global ===== */
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && $('modal').classList.contains('show')) {
    if (e.target.tagName === 'TEXTAREA') return;
    e.preventDefault(); $('modal-ok').click();
  }
  if (e.key === 'Escape' && $('modal').classList.contains('show')) cerrarModal();
});
/* Función para resaltar la columna del calendario al hacer clic */
function resaltarGantt(colId) {
  // 1. Limpiar los resaltados anteriores
  document.querySelectorAll('.cal-resaltada').forEach(function(el) {
    el.classList.remove('cal-resaltada');
    el.style.boxShadow = '';
    el.style.backgroundColor = ''; 
  });
  
  // 2. Aplicar el marco a la nueva columna seleccionada
  document.querySelectorAll('.' + colId).forEach(function(el) {
    el.classList.add('cal-resaltada');
    
    // Si la celda NO tiene una tarea asignada (no tiene clases cal-bar-...), le damos fondo azul tenue
    if (el.className.indexOf('cal-bar-') === -1) {
      el.style.backgroundColor = 'rgba(59, 130, 246, 0.10)'; 
    }
    
    // A TODAS (incluyendo las tareas) les ponemos un marco azul elegante
    el.style.boxShadow = 'inset 0 0 0 2px #3b82f6'; 
  });
}
