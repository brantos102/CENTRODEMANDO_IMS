<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b1220; --panel:#131c2e; --panel-2:#1c2740; --border:#283352;
            --text:#e8ecf3; --muted:#7d8aa8; --accent:#3b82f6; --ok:#22c55e; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
           margin:0; padding:14px; font-size:13px; }
    h2 { margin:0 0 10px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
            padding-bottom:10px; border-bottom:1px solid var(--border); }
    .controls { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
    .controls input, .controls select { background:var(--panel-2); border:1px solid var(--border);
                                         color:var(--text); padding:6px 10px; border-radius:5px;
                                         font-size:12px; font-family:inherit; }
    .controls input { min-width:200px; }
    .controls .spacer { flex:1; }
    .lbl { font-size:11px; color:var(--muted); }
    .actions-row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
    .btn { background:var(--panel-2); border:1px solid var(--border); color:var(--text);
           padding:6px 12px; border-radius:5px; font-size:11px; cursor:pointer; font-family:inherit; }
    .btn:hover { border-color:var(--accent); }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .btn-primary:hover { background:#2563eb; }
    .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
    .tabla { background:var(--panel); border:1px solid var(--border); border-radius:8px;
             max-height:380px; overflow-y:auto; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    thead th { background:var(--panel-2); padding:8px 10px; text-align:left;
               font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase;
               letter-spacing:0.5px; position:sticky; top:0; border-bottom:1px solid var(--border); }
    tbody td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,0.04); }
    tbody tr:hover { background:rgba(59,130,246,0.06); }
    tbody tr.selected { background:rgba(59,130,246,0.13); }
    input[type=checkbox] { cursor:pointer; transform:scale(1.1); }
    .pill { font-size:10px; padding:3px 8px; border-radius:10px; font-weight:600; }
    .pill-ok { background:rgba(34,197,94,0.15); color:#86efac; }
    .pill-warn { background:rgba(234,179,8,0.15); color:#fde047; }
    .pill-muted { background:rgba(125,138,168,0.15); color:var(--muted); }
    .stat-bar { background:var(--panel); border:1px solid var(--border); padding:10px 14px;
                border-radius:8px; display:flex; gap:18px; margin-top:10px; }
    .stat-item .v { font-size:18px; font-weight:600; }
    .stat-item .l { font-size:10px; color:var(--muted); }
    #status { font-size:11px; color:var(--muted); margin-top:8px; }
    #status.success { color:var(--ok); }
    #status.error { color:var(--danger); }
    .empty { text-align:center; padding:24px; color:var(--muted); }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>

  <div class="head">
    <h2>📦 Seleccionar inventarios a descargar</h2>
    <button class="btn" onclick="google.script.host.close()">✕</button>
  </div>

  <div class="controls">
    <input type="text" id="q" placeholder="🔍 Buscar cliente o nombre…" oninput="aplicar()">
    <select id="f-cliente" onchange="aplicar()">
      <option value="">Todos los clientes</option>
    </select>
    <select id="f-avance" onchange="aplicar()">
      <option value="">Todos los estados</option>
      <option value="entregado">Entregados</option>
      <option value="proceso">En proceso</option>
      <option value="vacio">Sin estado</option>
    </select>
    <div class="spacer"></div>
    <span class="lbl"><span id="count">0</span> de <span id="total">0</span> seleccionados</span>
  </div>

  <div class="actions-row">
    <button class="btn" onclick="toggleAll(true)">☑ Seleccionar todos</button>
    <button class="btn" onclick="toggleAll(false)">☐ Limpiar selección</button>
    <button class="btn" onclick="seleccionarEntregados()">✓ Solo entregados</button>
    <div style="flex:1"></div>
    <button class="btn-primary btn" id="btn-zip" onclick="descargar()" disabled>📥 Descargar ZIP</button>
  </div>

  <div class="tabla">
    <table>
      <thead>
        <tr>
          <th style="width:30px;"><input type="checkbox" id="chk-all" onclick="toggleAll(this.checked)"></th>
          <th>Cliente</th>
          <th>Nombre / Link</th>
          <th>Fecha</th>
          <th>Avance</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" class="empty">Cargando inventarios…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="status"></div>
  <a id="dl" style="display:none;"></a>

  <script>
    var TODOS = [];
    var FILTRADOS = [];
    var SEL = new Set();

    window.onload = function() {
      google.script.run.withSuccessHandler(function(lista) {
        TODOS = lista || [];
        document.getElementById('total').innerText = TODOS.length;
        // Llenar select clientes
        var clientes = [...new Set(TODOS.map(x => x.cliente).filter(Boolean))].sort();
        var sel = document.getElementById('f-cliente');
        clientes.forEach(c => { var opt = document.createElement('option'); opt.value = opt.text = c; sel.add(opt); });
        aplicar();
      }).withFailureHandler(function(err) {
        document.getElementById('tbody').innerHTML = '<tr><td colspan="5" class="empty" style="color:#fca5a5;">Error: ' + err.message + '</td></tr>';
      }).obtenerListadoParaSelectorZip();
    };

    function aplicar() {
      var q = document.getElementById('q').value.toLowerCase().trim();
      var cli = document.getElementById('f-cliente').value;
      var av = document.getElementById('f-avance').value;
      FILTRADOS = TODOS.filter(function(x) {
        if (cli && x.cliente !== cli) return false;
        if (av === 'entregado' && String(x.avance).toLowerCase().indexOf('entregado') === -1) return false;
        if (av === 'proceso' && String(x.avance).toLowerCase().indexOf('proceso') === -1) return false;
        if (av === 'vacio' && x.avance) return false;
        if (q) {
          var hay = (x.cliente + ' ' + x.nombre).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
      pintar();
    }

    function pintar() {
      var tb = document.getElementById('tbody');
      if (FILTRADOS.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" class="empty">Sin resultados con esos filtros.</td></tr>';
      } else {
        tb.innerHTML = FILTRADOS.map(function(x) {
          var av = String(x.avance || '').toLowerCase();
          var pill = 'pill-muted', txt = x.avance || '—';
          if (av.indexOf('entregado') !== -1) pill = 'pill-ok';
          else if (av.indexOf('proceso') !== -1) pill = 'pill-warn';
          var checked = SEL.has(x.fileId) ? 'checked' : '';
          var selCls = SEL.has(x.fileId) ? 'selected' : '';
          return '<tr class="' + selCls + '" data-id="' + x.fileId + '">' +
            '<td><input type="checkbox" data-id="' + x.fileId + '" ' + checked + ' onclick="seleccionar(this)"></td>' +
            '<td><b>' + escape(x.cliente) + '</b></td>' +
            '<td style="font-size:11px;color:#94a3b8;">' + escape(x.nombre) + '</td>' +
            '<td style="font-size:11px;color:#94a3b8;">' + escape(x.fecha) + '</td>' +
            '<td><span class="pill ' + pill + '">' + escape(txt) + '</span></td>' +
            '</tr>';
        }).join('');
      }
      actualizarCount();
    }

    function escape(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function seleccionar(chk) {
      if (chk.checked) SEL.add(chk.dataset.id); else SEL.delete(chk.dataset.id);
      var tr = chk.closest('tr'); if (tr) tr.classList.toggle('selected', chk.checked);
      actualizarCount();
    }

    function toggleAll(activar) {
      FILTRADOS.forEach(function(x) {
        if (activar) SEL.add(x.fileId); else SEL.delete(x.fileId);
      });
      pintar();
    }

    function seleccionarEntregados() {
      FILTRADOS.forEach(function(x) {
        if (String(x.avance).toLowerCase().indexOf('entregado') !== -1) SEL.add(x.fileId);
      });
      pintar();
    }

    function actualizarCount() {
      document.getElementById('count').innerText = SEL.size;
      document.getElementById('btn-zip').disabled = SEL.size === 0;
    }

    function descargar() {
      if (SEL.size === 0) return;
      var seleccionados = TODOS.filter(function(x) { return SEL.has(x.fileId); });
      var btn = document.getElementById('btn-zip');
      var st = document.getElementById('status');
      btn.disabled = true; btn.innerText = '⏳ Empaquetando ' + seleccionados.length + ' archivos…';
      st.innerText = 'Esto puede tardar 30s-2min según el tamaño.'; st.className = '';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.innerText = '📥 Descargar ZIP'; btn.disabled = false;
          st.innerText = '✓ ZIP listo: ' + res.procesados + ' archivos' + (res.errores.length ? ' (' + res.errores.length + ' fallaron)' : '');
          st.className = 'success';
          // Crear y disparar descarga
          var bytes = atob(res.base64);
          var arr = new Uint8Array(bytes.length);
          for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          var blob = new Blob([arr], { type: 'application/zip' });
          var url = URL.createObjectURL(blob);
          var a = document.getElementById('dl');
          a.href = url; a.download = res.fileName; a.style.display = 'inline-block'; a.click();
        })
        .withFailureHandler(function(err) {
          btn.innerText = '📥 Descargar ZIP'; btn.disabled = false;
          st.innerText = 'Error: ' + err.message; st.className = 'error';
        })
        .procesarSelectorZip(seleccionados);
    }

    /* ESC cierra */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') google.script.host.close();
    });
  </script>
</body>
</html>
